; COPYTRADE-AUTO-001 常驻配置（paper 默认）
; 用法：supervisorctl reread && supervisorctl update && supervisorctl status copytrade
; 熔断：python daemon.py --kill  / --unkill（无需重启进程）

[program:copytrade]
command=python /path/to/copytrade/daemon.py --loop
directory=/path/to/copytrade
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
stdout_logfile=/path/to/copytrade/data/daemon.log
stderr_logfile=/path/to/copytrade/data/daemon.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=CT_MODE="paper",CT_POLL_INTERVAL="15"

; watchdog：数据源故障（退出码=1）时告警；交易员静默（退出码=0）不告警
[program:copytrade_health]
command=python /path/to/copytrade/daemon.py --health
autostart=false
