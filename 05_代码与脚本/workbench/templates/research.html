<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键投研</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #0f1115;
            color: #e6e8eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        a {
            color: #60a5fa;
        }

        .r-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid #1e222a;
            background: #12151b;
            flex-shrink: 0;
        }

        .r-title {
            font-size: 15px;
            font-weight: 600;
        }

        .r-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .r-actions button {
            background: #374151;
            color: #d1d5db;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .r-actions button:hover {
            background: #4b5563;
        }

        .r-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .r-sidebar {
            width: 360px;
            border-right: 1px solid #1e222a;
            overflow-y: auto;
            padding: 16px;
            background: #12151b;
            flex-shrink: 0;
        }

        .r-sidebar h3 {
            font-size: 12px;
            color: #8a92a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 16px 0 8px;
        }

        .r-sidebar h3:first-child {
            margin-top: 0;
        }

        .r-missing-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            background: #171a21;
            border: 1px solid #1e222a;
        }

        .r-missing-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .r-missing-item .dot.ok {
            background: #10b981;
        }

        .r-missing-item .dot.miss {
            background: #dc2626;
        }

        .r-group {
            border: 1px solid #1e222a;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #171a21;
            overflow: hidden;
        }

        .r-group-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            font-weight: 500;
        }

        .r-group-head:hover {
            background: #1c2129;
        }

        .r-group-head .chev {
            margin-left: auto;
            color: #8a92a0;
            font-size: 11px;
            transition: transform .15s;
        }

        .r-group.open .r-group-head .chev {
            transform: rotate(90deg);
        }

        .r-group-head .cnt {
            color: #6b7280;
            font-size: 11px;
            font-weight: 400;
        }

        .r-group-body {
            display: none;
            border-top: 1px solid #1e222a;
            padding: 8px;
        }

        .r-group.open .r-group-body {
            display: block;
        }

        .r-src {
            margin-bottom: 8px;
        }

        .r-src:last-child {
            margin-bottom: 0;
        }

        .r-src-head {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            word-break: break-all;
        }

        .r-src-head a {
            text-decoration: none;
            color: #9ca3af;
            flex: 1;
        }

        .r-src-head a:hover {
            text-decoration: underline;
            color: #e6e8eb;
        }

        .r-src-head .r-content-btn {
            background: #272d38;
            color: #9ca3af;
            border: none;
            border-radius: 5px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
        }

        .r-src-head .r-content-btn:hover {
            background: #374151;
        }

        .r-src-head .r-src-date {
            color: #6b7280;
            font-size: 11px;
            flex-shrink: 0;
            white-space: nowrap;
            margin-top: 1px;
        }

        .r-src-content {
            margin-top: 6px;
            padding: 8px 10px;
            background: #0d1014;
            border: 1px solid #1e222a;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            color: #b8bec7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 240px;
            overflow-y: auto;
        }

        .r-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow-y: auto;
        }

        .r-messages {
            flex: 1;
            padding: 20px;
        }

        .r-msg {
            max-width: 760px;
            margin-bottom: 16px;
        }

        .r-msg-role {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .r-msg-content {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .r-msg.user .r-msg-content {
            background: #1c2533;
            border-color: #2b3a52;
        }

        .r-citations {
            margin-top: 8px;
            font-size: 11px;
            color: #8a92a0;
        }

        .r-citations a {
            color: #60a5fa;
            text-decoration: none;
        }

        .r-citations a:hover {
            text-decoration: underline;
        }

        .r-cite {
            display: block;
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid #2a2f3a;
        }

        .r-thesis {
            flex-shrink: 0;
            margin: 16px 20px 0;
            padding: 14px 16px;
            background: #14181f;
            border: 1px solid #1e222a;
            border-radius: 10px;
        }

        /* 一页结论 */
        .r-onepage {
            flex-shrink: 0;
            margin: 16px 20px 0;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1a1f2e 0%, #14181f 100%);
            border: 1px solid #2a3550;
            border-radius: 12px;
        }

        .r-onepage .op-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .r-onepage .op-head h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }

        .r-onepage .op-stance {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .r-onepage .op-stance.bullish {
            background: #0b3d2a;
            color: #34d399;
        }

        .r-onepage .op-stance.bearish {
            background: #3d1616;
            color: #f87171;
        }

        .r-onepage .op-stance.neutral {
            background: #2a2f3a;
            color: #9ca3af;
        }

        .r-onepage .op-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .r-onepage .op-item {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .r-onepage .op-item .op-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .r-onepage .op-item .op-value {
            font-size: 13px;
            font-weight: 500;
            color: #e6e8eb;
            line-height: 1.4;
        }

        .r-onepage .op-item .op-value.positive {
            color: #34d399;
        }

        .r-onepage .op-item .op-value.negative {
            color: #f87171;
        }

        .r-onepage .op-item .op-value.warning {
            color: #f59e0b;
        }

        .r-onepage .op-item .op-sub {
            font-size: 10px;
            color: #4b5563;
            margin-top: 2px;
        }

        .r-thesis .t-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .r-thesis .t-stance {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .r-thesis .t-conviction {
            font-size: 11px;
            color: #8a92a0;
        }

        .r-thesis .t-section {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px 0 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .r-thesis .t-snapshot {
            font-size: 10px;
            text-transform: none;
            letter-spacing: 0;
            color: #9ca3af;
            background: #1f2937;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: normal;
        }

        .r-thesis .t-point {
            font-size: 13px;
            line-height: 1.6;
            margin: 4px 0;
            padding-left: 10px;
            border-left: 2px solid #2a2f3a;
        }

        .r-thesis .t-cite {
            color: #60a5fa;
            font-size: 11px;
            margin-left: 4px;
        }

        .r-thesis .t-empty {
            color: #6b7280;
            font-size: 13px;
        }

        .r-thesis .t-metrics {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .r-thesis .t-dim-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .r-thesis .t-dim-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px 12px;
            border-left: 3px solid #3b82f6;
        }

        .r-thesis .t-dim-head {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .r-thesis .t-dim-icon {
            font-size: 14px;
        }

        .r-thesis .t-dim-title {
            font-weight: 600;
            font-size: 13px;
            color: #f1f5f9;
        }

        .r-thesis .t-dim-desc {
            font-size: 11px;
            color: #64748b;
            margin-left: auto;
        }

        .r-thesis .t-dim-summary {
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .r-thesis .t-dim-points {
            border-top: 1px solid #334155;
            padding-top: 6px;
        }

        .r-thesis .t-dim-point {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            padding: 2px 0;
        }

        .r-thesis .t-inferred {
            color: #f59e0b;
            font-size: 10px;
            opacity: 0.8;
        }

        .r-thesis .t-gen-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .r-thesis .t-gen-btn:hover {
            background: #2563eb;
        }

        .r-thesis .t-gen-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .r-thesis .t-refs {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #1e222a;
            font-size: 11px;
            color: #6b7280;
        }

        .r-thesis .t-refs h4 {
            margin: 0 0 6px;
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .r-thesis .t-refs ol {
            margin: 0;
            padding-left: 18px;
            line-height: 1.6;
        }

        .r-thesis .t-refs a {
            color: #60a5fa;
            text-decoration: none;
            word-break: break-all;
        }

        .r-thesis .t-refs a:hover {
            text-decoration: underline;
        }

        .r-thesis .t-ref-structured {
            color: #9ca3af;
            font-style: italic;
        }

        .r-thesis .t-collapsible .t-section {
            cursor: pointer;
            user-select: none;
        }

        .r-thesis .t-collapsible .t-section::after {
            content: ' ▼';
            font-size: 10px;
            color: #4b5563;
        }

        .r-thesis .t-collapsible.collapsed .t-section::after {
            content: ' ▶';
        }

        .r-thesis .t-collapsible.collapsed .t-body {
            display: none;
        }

        .cell-na {
            color: #4b5563;
            font-size: 11px;
        }

        /* 竞品对比 */
        .r-competitors {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .r-competitors .c-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .r-competitors .c-head h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .r-competitors .c-sector {
            font-size: 12px;
            color: #fbbf24;
        }

        .r-competitors .c-table-wrap {
            overflow-x: auto;
        }

        .r-competitors table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }

        .r-competitors th,
        .r-competitors td {
            padding: 8px 10px;
            text-align: right;
            border-bottom: 1px solid #1e222a;
            white-space: nowrap;
        }

        .r-competitors th:first-child,
        .r-competitors td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #171a21;
            z-index: 1;
        }

        .r-competitors th {
            color: #8a92a0;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }

        .r-competitors th:hover {
            color: #e6e8eb;
        }

        .r-competitors tr.target-row td {
            background: rgba(59, 130, 246, 0.08);
            font-weight: 600;
        }

        .r-competitors tr.target-row td:first-child {
            background: rgba(59, 130, 246, 0.12);
        }

        .r-competitors td .coin-sym {
            color: #e6e8eb;
            font-weight: 500;
        }

        .r-competitors td .coin-name {
            color: #6b7280;
            font-size: 11px;
            margin-left: 4px;
        }

        .r-competitors .c-empty {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .r-competitors .c-loading {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* 背离检测 */
        .r-divergence {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .r-divergence .d-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .r-divergence .d-head h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .r-divergence .d-signal {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .r-divergence .d-signal.bearish {
            background: rgba(239, 68, 68, 0.08);
            border-color: #ef4444;
        }

        .r-divergence .d-signal.bullish {
            background: rgba(16, 185, 129, 0.08);
            border-color: #10b981;
        }

        .r-divergence .d-signal .d-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .r-divergence .d-signal.bearish .d-title {
            color: #f87171;
        }

        .r-divergence .d-signal.bullish .d-title {
            color: #34d399;
        }

        .r-divergence .d-signal .d-severity {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .r-divergence .d-signal.bearish .d-severity.high {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .r-divergence .d-signal.bearish .d-severity.medium {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        .r-divergence .d-signal.bullish .d-severity.high {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .r-divergence .d-signal.bullish .d-severity.medium {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
        }

        .r-divergence .d-signal .d-desc {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .r-divergence .d-signal .d-conds {
            font-size: 11px;
        }

        .r-divergence .d-signal .d-cond {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }

        .r-divergence .d-signal .d-cond .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .r-divergence .d-signal .d-cond.matched .dot {
            background: currentColor;
        }

        .r-divergence .d-signal .d-cond.unmatched .dot {
            background: #374151;
        }

        .r-divergence .d-signal .d-cond.unmatched {
            color: #6b7280;
        }

        .r-divergence .d-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e222a;
        }

        .r-divergence .d-metric {
            text-align: center;
        }

        .r-divergence .d-metric .dm-label {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .r-divergence .d-metric .dm-value {
            font-size: 13px;
            font-weight: 600;
            color: #e6e8eb;
        }

        .r-divergence .d-empty {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 16px;
        }

        .r-divergence .d-loading {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 16px;
        }

        /* 链上持仓趋势 */
        .r-chain-trend {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .r-chain-trend .ct-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .r-chain-trend .ct-head h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .r-chain-trend .ct-tabs {
            display: flex;
            gap: 4px;
        }

        .r-chain-trend .ct-tab {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: #6b7280;
            background: transparent;
            border: 1px solid #1e222a;
        }

        .r-chain-trend .ct-tab.active {
            color: #e6e8eb;
            background: #1f2937;
            border-color: #374151;
        }

        .r-chain-trend .ct-chart-wrap {
            margin-bottom: 12px;
        }

        .r-chain-trend .ct-chart-title {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .r-chain-trend .ct-chart-title .ct-val {
            color: #e6e8eb;
            font-weight: 600;
        }

        .r-chain-trend .ct-spark {
            width: 100%;
            height: 48px;
        }

        .r-chain-trend .ct-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #1e222a;
        }

        .r-chain-trend .ct-metric {
            text-align: center;
        }

        .r-chain-trend .ct-metric .ctm-label {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .r-chain-trend .ct-metric .ctm-value {
            font-size: 13px;
            font-weight: 600;
            color: #e6e8eb;
        }

        .r-chain-trend .ct-metric .ctm-change {
            font-size: 10px;
            margin-top: 1px;
        }

        .r-chain-trend .ct-metric .ctm-change.up {
            color: #10b981;
        }

        .r-chain-trend .ct-metric .ctm-change.down {
            color: #ef4444;
        }

        .r-chain-trend .ct-empty {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .r-chain-trend .ct-empty small {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: #4b5563;
        }

        /* 衍生品资金面 */
        .r-derivatives {

                    <span style="font-size:11px;color:#6b7280">日级行情快照</span>
                </div>
                <div id="m-container">
                    <div class="m-empty">加载中...</div>
                </div>
            </div>
            <div class="r-signals" id="r-signals" style="display:none">
                <div class="s-head">
                    <h3>⚡ 异动信号</h3>
                    <span style="font-size:11px;color:#6b7280">价格/成交量/衍生品/解锁</span>
                </div>
                <div id="sg-container">
                    <div class="sg-empty">加载中...</div>
                </div>
            </div>
            <div class="r-messages" id="r-messages"></div>
            <div class="r-input">
                <textarea id="r-question" placeholder="输入问题，回答将严格基于已收集资料并标注来源...（Enter 发送，Shift+Enter 换行）"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askResearchQuestion();}"></textarea>
                <button id="r-ask-btn" onclick="askResearchQuestion()">发送</button>
            </div>
        </section>
    </div>

    <script>
        const ASSET_ID = {{ asset_id }};
        let researchNotebookId = null;
        let researchAsking = false;
        let filling = false;

        function escapeHtml (s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }
        function attrEscape (s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function sleep (ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        async function safeJson (res, url) {
            if (!res.ok) {
                let detail = '';
                try { detail = (await res.text()).slice(0, 200); } catch (e) { }
                throw new Error('服务器错误 ' + res.status + (detail ? '（' + detail + '）' : ''));
            }
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                throw new Error('服务器返回异常响应: ' + text.slice(0, 200));
            }
        }

        async function waitForTask (taskId, maxWait = 600000) {
            const start = Date.now();
            while (Date.now() - start < maxWait) {
                await sleep(2000);
                let data;
                try {
                    const res = await fetch('/api/tasks/' + taskId);
                    data = await safeJson(res, '/api/tasks/' + taskId);
                } catch (e) {
                    continue;
                }
                if (data.ok && data.task && data.task.status !== 'pending' && data.task.status !== 'running') {
                    return;
                }
            }
        }

        // ── 加载笔记本 ──
        async function loadNotebook (refresh) {
            try {
                let url = '/api/research/' + ASSET_ID + '/notebook';
                if (refresh) url += '?refresh=1';
                const res = await fetch(url);
                const data = await safeJson(res, url);
                if (!data.ok || !data.data) throw new Error(data.error || '打开失败');
                researchNotebookId = data.data.notebook_id;
                render(data.data);
            } catch (e) {
                document.getElementById('r-title').textContent = '🤖 一键投研';
                document.getElementById('r-sidebar').innerHTML = '<div class="no-data">打开失败: ' + escapeHtml(e.message) + '</div>';
                document.getElementById('r-messages').innerHTML = '<div class="no-data">打开失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        async function fillMissing () {
            if (filling) return;
            if (!confirm('将针对缺失项自动补齐投研资料（可能耗时较长），是否继续？')) return;
            filling = true;
            const btn = document.getElementById('r-fill-btn');
            btn.disabled = true;
            btn.textContent = '补齐中...';
            try {
                const res = await fetch('/api/research/' + ASSET_ID + '/fill-missing', { method: 'POST' });
                const data = await safeJson(res, '/api/research/' + ASSET_ID + '/fill-missing');
                if (!data.ok) throw new Error(data.error || '启动失败');

                await waitForTask(data.task_id, 1800000); // 最长 30 分钟

                const resultRes = await fetch('/api/tasks/' + data.task_id + '/result');
                const resultData = await safeJson(resultRes, '/api/tasks/' + data.task_id + '/result');

                let msg = '补齐完成';
                if (resultData.pending) {
                    msg = '补齐仍在后台进行中，可稍后重新打开本页查看最新进度。';
                } else if (resultData.ok && resultData.result && resultData.result.ok) {
                    const d = resultData.result.data || {};
                    msg = d.message || msg;
                    if (d.filled && d.filled.length) {
                        msg += '\n\n本次补齐：' + d.filled.map(function (x) { return x.label; }).join('、');
                    }
                    if (d.still_missing && d.still_missing.length) {
                        msg += '\n\n仍缺失：' + d.still_missing.map(function (x) { return x.label; }).join('、');
                    }
                } else {
                    msg = '补齐失败：' + ((resultData.result && resultData.result.error) || resultData.error || '未知错误');
                }
                alert(msg);
                await loadNotebook(true); // 强制重采快照
            } catch (e) {
                alert('补齐失败: ' + e.message);
                await loadNotebook(true);
            }
            filling = false;
            btn.disabled = false;
            btn.textContent = '补齐缺失';
        }

        // ── 一页结论：各维度数据聚合 ──
        var onepageData = {
            thesis: null,       // { stance, conviction }
            divergence: null,   // { signals, metrics }
            unlock: null,       // { unlock_pct_30d, pressure_score, risk_level }
            onchain: null,      // { top10_concentration_pct, holder_change_7d_pct, whale_change_7d_pct }
            derivatives: null   // { funding_rate_pct, oi_change_24h_pct, cvd_ratio_24h }
        };

        function updateOnepage () {
            const box = document.getElementById('r-onepage');
            const d = onepageData;
            // 至少有 thesis 或 2 个以上维度有数据才显示
            const hasData = d.thesis || [d.divergence, d.unlock, d.onchain, d.derivatives].filter(Boolean).length >= 2;
            if (!hasData) return;
            box.style.display = 'block';

            // 综合立场
            const stanceEl = document.getElementById('op-stance');
            const thesisEl = document.getElementById('op-thesis');
            if (d.thesis) {
                const stanceMap = { bullish: '看多', bearish: '看空', neutral: '中性' };
                const convMap = { high: '高置信', medium: '中置信', low: '低置信' };
                const label = stanceMap[d.thesis.stance] || '中性';
                stanceEl.textContent = label;
                stanceEl.className = 'op-stance ' + (d.thesis.stance || 'neutral');
                thesisEl.textContent = (convMap[d.thesis.conviction] || '') + ' · AI 投研结论';
            } else {
                stanceEl.textContent = '待生成';
                stanceEl.className = 'op-stance neutral';
                thesisEl.textContent = '点击"生成研究结论"获取 AI 观点';
            }

            // 背离信号
            const divEl = document.getElementById('op-divergence');
            const divSub = document.getElementById('op-divergence-sub');
            if (d.divergence && d.divergence.signals && d.divergence.signals.length > 0) {
                const sig = d.divergence.signals[0];
                const isBullish = sig.type === 'bullish_divergence';
                divEl.textContent = (isBullish ? '看涨背离' : '看跌背离') + ' · ' + Math.round(sig.confidence) + '%';
                divEl.className = 'op-value ' + (isBullish ? 'positive' : 'negative');
                divSub.textContent = d.divergence.signals.length + ' 个信号 · ' + (sig.label || '');
            } else if (d.divergence && d.divergence.metrics) {
                divEl.textContent = '无明显背离';
                divEl.className = 'op-value';
                const m = d.divergence.metrics;
                const parts = [];
                if (m.price_change_24h !== null && m.price_change_24h !== undefined)
                    parts.push('24h ' + (m.price_change_24h >= 0 ? '+' : '') + Number(m.price_change_24h).toFixed(2) + '%');
                if (m.sentiment_score !== null && m.sentiment_score !== undefined)
                    parts.push('情绪 ' + Number(m.sentiment_score).toFixed(1));
                divSub.textContent = parts.join(' · ');
            } else {
                divEl.textContent = '检测中...';
                divEl.className = 'op-value';
                divSub.textContent = '';
            }

            // 解锁压力
            const unEl = document.getElementById('op-unlock');
            const unSub = document.getElementById('op-unlock-sub');
            if (d.unlock && (d.unlock.unlock_pct_30d !== null && d.unlock.unlock_pct_30d !== undefined)) {
                const pct = Number(d.unlock.unlock_pct_30d);
                let label = '低压力', cls = 'positive';
                if (pct > 5) { label = '高抛压'; cls = 'negative'; }
                else if (pct > 1) { label = '中压力'; cls = 'warning'; }
                unEl.textContent = label + ' · 30d ' + pct.toFixed(2) + '%';
                unEl.className = 'op-value ' + cls;
                if (d.unlock.pressure_score !== null && d.unlock.pressure_score !== undefined)
                    unSub.textContent = '抛压评分 ' + Number(d.unlock.pressure_score).toFixed(1);
            } else {
                unEl.textContent = '暂无解锁数据';
                unEl.className = 'op-value';
                unSub.textContent = '';
            }

            // 链上异动
            const ocEl = document.getElementById('op-onchain');
            const ocSub = document.getElementById('op-onchain-sub');
            if (d.onchain) {
                const parts = [];
                let mainLabel = '链上平稳', mainCls = '';
                if (d.onchain.whale_change_7d_pct !== null && d.onchain.whale_change_7d_pct !== undefined) {
                    const wc = Number(d.onchain.whale_change_7d_pct);
                    if (wc > 5) { mainLabel = '鲸鱼增持'; mainCls = 'positive'; }
                    else if (wc < -5) { mainLabel = '鲸鱼减持'; mainCls = 'negative'; }
                    parts.push('鲸鱼 7d ' + (wc >= 0 ? '+' : '') + wc.toFixed(2) + '%');
                }
                if (d.onchain.holder_change_7d_pct !== null && d.onchain.holder_change_7d_pct !== undefined) {
                    const hc = Number(d.onchain.holder_change_7d_pct);
                    parts.push('持币地址 7d ' + (hc >= 0 ? '+' : '') + hc.toFixed(2) + '%');
                }
                if (d.onchain.top10_concentration_pct !== null && d.onchain.top10_concentration_pct !== undefined) {
                    const t10 = Number(d.onchain.top10_concentration_pct);
                    if (t10 > 70 && !mainCls) { mainLabel = '高度集中'; mainCls = 'warning'; }
                    parts.push('Top10 ' + t10.toFixed(1) + '%');
                }
                ocEl.textContent = mainLabel;
                ocEl.className = 'op-value ' + mainCls;
                ocSub.textContent = parts.join(' · ');
            } else {
                ocEl.textContent = '链上数据加载中';
                ocEl.className = 'op-value';
                ocSub.textContent = '';
            }

            // 衍生品情绪
            const dvEl = document.getElementById('op-derivatives');
            const dvSub = document.getElementById('op-derivatives-sub');
            if (d.derivatives && d.derivatives.funding_rate_pct !== null && d.derivatives.funding_rate_pct !== undefined) {
                const fr = Number(d.derivatives.funding_rate_pct);
                let label = '中性情绪', cls = '';
                if (fr > 0.05) { label = '多头亢奋'; cls = 'positive'; }
                else if (fr > 0.01) { label = '偏多'; cls = 'positive'; }
                else if (fr < -0.05) { label = '空头拥挤'; cls = 'negative'; }
                else if (fr < -0.01) { label = '偏空'; cls = 'negative'; }
                dvEl.textContent = label + ' · 费率 ' + (fr >= 0 ? '+' : '') + fr.toFixed(4) + '%';
                dvEl.className = 'op-value ' + cls;
                const subs = [];
                if (d.derivatives.oi_change_24h_pct !== null && d.derivatives.oi_change_24h_pct !== undefined) {
                    const oi = Number(d.derivatives.oi_change_24h_pct);
                    subs.push('OI 24h ' + (oi >= 0 ? '+' : '') + oi.toFixed(2) + '%');
                }
                if (d.derivatives.cvd_ratio_24h !== null && d.derivatives.cvd_ratio_24h !== undefined) {
                    const cvd = Number(d.derivatives.cvd_ratio_24h);
                    subs.push('CVD ' + (cvd >= 0 ? '+' : '') + (cvd * 100).toFixed(2) + '%');
                }
                dvSub.textContent = subs.join(' · ');
            } else if (d.derivatives && d.derivatives.available_exchanges && d.derivatives.available_exchanges.length === 0) {
                dvEl.textContent = '无合约数据';
                dvEl.className = 'op-value';
                dvSub.textContent = '该代币可能无永续合约';
            } else {
                dvEl.textContent = '衍生品数据加载中';
                dvEl.className = 'op-value';
                dvSub.textContent = '';
            }
        }

        function render (d) {
            window.RESEARCH_DATA = d;  // FIX-F: 供「投研链接」按钮读取已加载的外部链接
            const title = d.title || '一键投研';
            document.getElementById('r-title').textContent = '🤖 ' + title;
            document.title = title;
            // 收集 thesis + structured metrics 到一页结论
            const sm = (d.thesis && d.thesis.structured_metrics) || d.structured_metrics || {};
            if (d.thesis) {
                onepageData.thesis = { stance: d.thesis.stance, conviction: d.thesis.conviction };
            }
            if (sm.unlock || sm.pressure) {
                onepageData.unlock = {
                    unlock_pct_30d: sm.unlock ? sm.unlock.unlock_pct_30d : null,
                    pressure_score: sm.pressure ? sm.pressure.pressure_score : null,
                    risk_level: sm.pressure ? sm.pressure.risk_level : null,
                };
            }
            if (sm.onchain) {
                onepageData.onchain = {
                    top10_concentration_pct: sm.onchain.top10_concentration_pct,
                    holder_change_7d_pct: null,
                    whale_change_7d_pct: null,
                };
            }
            if (sm.derivatives && Object.keys(sm.derivatives).length > 0) {
                onepageData.derivatives = sm.derivatives;
            }
            updateOnepage();
            renderThesis(d);
            renderSidebar(d);
            renderMessages(d.messages || []);
            loadCompetitors();
            loadDivergence();
            loadChainTrend();
            loadDerivatives();
            loadWhaleFlow();
            loadTokenomics();
            loadMarketHistory();
            loadSignals();
        }

        function renderThesis (d) {
            const box = document.getElementById('r-thesis');
            const t = d.thesis;
            const sources = d.sources || [];
            const structuredMetrics = (t && t.structured_metrics) || d.structured_metrics || {};
            if (!t) {
                box.style.display = 'block';
                box.innerHTML = '<div class="t-empty">暂无研究结论</div>' +
                    '<div style="margin-top:8px"><button class="t-gen-btn" id="t-gen-btn" onclick="generateThesis()">生成研究结论</button></div>';
                return;
            }
            const stanceMap = {
                bullish: { label: '看多', bg: '#0b3d2a', color: '#34d399' },
                bearish: { label: '看空', bg: '#3d1616', color: '#f87171' },
                neutral: { label: '中性', bg: '#2a2f3a', color: '#9ca3af' }
            };
            const s = stanceMap[t.stance] || stanceMap.neutral;
            const convMap = { high: '高置信', medium: '中置信', low: '低置信' };
            // B2：展示结论最后生成时间，让用户判断数据时效（结论为生成时快照，可能滞后于实时 API）
            const genTime = t.updated_at || t.created_at;
            let genLabel = '';
            if (genTime) {
                genLabel = '<span class="t-snapshot" title="结论最后生成时间（' + escapeHtml(genTime) + '）。结论为生成时的行情快照，可能与实时 API 存在滞后。">🕒 结论生成于 ' + escapeHtml(formatTimeAgo(genTime)) + '</span>';
            }
            let html = '<div class="t-head">' +
                '<span class="t-stance" style="background:' + s.bg + ';color:' + s.color + '">' + s.label + '</span>' +
                '<span class="t-conviction">' + (convMap[t.conviction] || t.conviction) + '</span>' +
                genLabel +
                '<span style="margin-left:auto"><button class="t-gen-btn" onclick="generateThesis()">重新生成</button></span>' +
                '</div>';

            // 关键指标（优先用结构化指标，不用 LLM 生成的）
            const sm = structuredMetrics || {};
            const hasStructuredMetrics = sm.market && Object.keys(sm.market).length > 0;
            if (hasStructuredMetrics) {
                let snapshotLabel = '';
                if (sm.market.snapshot_time) {
                    snapshotLabel = '<span class="t-snapshot" title="行情数据快照时间">📊 行情截至 ' + escapeHtml(formatTimeAgo(sm.market.snapshot_time)) + '</span>';
                }
                html += '<div class="t-section">关键指标' + snapshotLabel + '</div><div class="t-metrics">';
                if (sm.market.price_usd) {
                    html += '<div><strong>价格</strong>: ' + fmtUsdPrice(sm.market.price_usd) + '</div>';
                }
                if (sm.market.market_cap_usd) {
                    html += '<div><strong>流通市值</strong>: ' + fmtUsdBig(sm.market.market_cap_usd) + '</div>';
                }
                if (sm.market.fdv_usd) {
                    html += '<div><strong>FDV（完全稀释估值）</strong>: ' + fmtUsdBig(sm.market.fdv_usd) + '</div>';
                }
                if (sm.tokenomics.total_supply) {
                    html += '<div><strong>总供应量</strong>: ' + fmtNumberBig(sm.tokenomics.total_supply) + '</div>';
                }
                if (sm.tokenomics.circulating_supply) {
                    html += '<div><strong>流通量</strong>: ' + fmtNumberBig(sm.tokenomics.circulating_supply) + '</div>';
                }
                if (sm.unlock.unlock_pct_30d !== null && sm.unlock.unlock_pct_30d !== undefined) {
                    html += '<div><strong>30天解锁比例</strong>: ' + fmtPct(sm.unlock.unlock_pct_30d) + '</div>';
                }
                if (sm.pressure.pressure_score !== null && sm.pressure.pressure_score !== undefined) {
                    const riskLvl = sm.pressure.risk_level || '';
                    html += '<div><strong>抛压评分</strong>: ' + Number(sm.pressure.pressure_score).toFixed(2) +
                        (riskLvl ? '（' + escapeHtml(riskLvl) + '）' : '') + '</div>';
                }
                if (sm.onchain.top10_concentration_pct !== null && sm.onchain.top10_concentration_pct !== undefined) {
                    html += '<div><strong>Top10持仓集中度</strong>: ' + fmtPct(sm.onchain.top10_concentration_pct) + '</div>';
                }
                if (sm.social.social_score !== null && sm.social.social_score !== undefined) {
                    html += '<div><strong>社交热度分</strong>: ' + fmtScore(sm.social.social_score) + '</div>';
                }
                // 衍生品指标
                if (sm.derivatives && Object.keys(sm.derivatives).length > 0) {
                    if (sm.derivatives.funding_rate_pct !== null && sm.derivatives.funding_rate_pct !== undefined) {
                        const fr = Number(sm.derivatives.funding_rate_pct);
                        html += '<div><strong>资金费率</strong>: <span style="color:' + (fr >= 0 ? '#34d399' : '#f87171') + '">' +
                            (fr >= 0 ? '+' : '') + fr.toFixed(4) + '%</span></div>';
                    }
                    if (sm.derivatives.oi_change_24h_pct !== null && sm.derivatives.oi_change_24h_pct !== undefined) {
                        const oi = Number(sm.derivatives.oi_change_24h_pct);
                        html += '<div><strong>OI 24h变化</strong>: <span style="color:' + (oi >= 0 ? '#34d399' : '#f87171') + '">' +
                            (oi >= 0 ? '+' : '') + oi.toFixed(2) + '%</span></div>';
                    }
                    if (sm.derivatives.total_oi_usd !== null && sm.derivatives.total_oi_usd !== undefined) {
                        html += '<div><strong>未平仓合约</strong>: ' + fmtUsdBig(sm.derivatives.total_oi_usd) + '</div>';
                    }
                }
                html += '</div>';
            } else {
                const km = t.key_metrics || {};
                const kmKeys = Object.keys(km);
                if (kmKeys.length) {
                    html += '<div class="t-section">关键指标</div><div class="t-metrics">';
                    kmKeys.forEach(function (k) {
                        html += '<div><strong>' + escapeHtml(k) + '</strong>: ' + escapeHtml(String(km[k])) + '</div>';
                    });
                    html += '</div>';
                }
            }

            // 四维框架卡片（新格式）
            const dims = t.dimensions;
            if (dims && typeof dims === 'object' && Object.keys(dims).length > 0) {
                const dimMeta = {
                    valuation: { label: '估值', icon: '📊', color: '#3b82f6', desc: '值不值得' },
                    supply: { label: '筹码', icon: '💰', color: '#f59e0b', desc: '风险在哪（筹码）' },
                    sentiment: { label: '情绪', icon: '🔥', color: '#ef4444', desc: '现在是不是时机' },
                    catalyst: { label: '催化', icon: '⚡', color: '#8b5cf6', desc: '风险在哪（外部）' },
                };
                html += '<div class="t-section">四维分析</div><div class="t-dim-grid">';
                ['valuation', 'supply', 'sentiment', 'catalyst'].forEach(function (key) {
                    const dim = dims[key];
                    const meta = dimMeta[key];
                    if (!dim || !meta) return;
                    const summary = dim.summary || '暂无数据';
                    const points = dim.points || [];
                    const hasPoints = points.length > 0;
                    html += '<div class="t-dim-card" style="border-left:3px solid ' + meta.color + '">' +
                        '<div class="t-dim-head">' +
                        '<span class="t-dim-icon">' + meta.icon + '</span>' +
                        '<span class="t-dim-title">' + meta.label + '</span>' +
                        '<span class="t-dim-desc">' + meta.desc + '</span>' +
                        '</div>' +
                        '<div class="t-dim-summary">' + escapeHtml(summary) + '</div>';
                    if (hasPoints) {
                        html += '<div class="t-dim-points">';
                        points.forEach(function (p) {
                            const cite = (p.citations || []).map(function (c) { return citeLabel(c); }).join('');
                            const inferred = p.is_inferred ? ' <span class="t-inferred" title="无引用源，AI推断">(推断)</span>' : '';
                            html += '<div class="t-dim-point">' + escapeHtml(p.point || '') + inferred + '<span class="t-cite">' + cite + '</span></div>';
                        });
                        html += '</div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }

            // 兼容两种 citation 格式：number（旧）和 {index,title,url}（新）
            function citeIndex (c) { return typeof c === 'object' && c ? c.index : Number(c); }
            function citeLabel (c) {
                if (typeof c === 'object' && c) return '[' + (c.index || '?') + ']';
                return '[' + c + ']';
            }
            const thesis = t.thesis || [];
            if (thesis.length) {
                html += '<div class="t-collapsible"><div class="t-section" onclick="toggleThesisSection(this)">核心论点</div><div class="t-body">';
                thesis.forEach(function (p) {

                    html += '<div class="t-point">' + escapeHtml(p.point || '') + '<span class="t-cite">' + cite + '</span></div>';
                });
                html += '</div></div>';
            }
            const risks = t.risks || [];
            if (risks.length) {
                html += '<div class="t-collapsible"><div class="t-section" onclick="toggleThesisSection(this)">风险点</div><div class="t-body">';
                risks.forEach(function (r) {
                    const cite = (r.citations || []).map(function (c) { return citeLabel(c); }).join('');
                    html += '<div class="t-point">' + escapeHtml(r.risk || '') + '<span class="t-cite">' + cite + '</span></div>';
                });
                html += '</div></div>';
            }
            const cats = t.catalysts || [];
            if (cats.length) {
                html += '<div class="t-collapsible"><div class="t-section" onclick="toggleThesisSection(this)">催化剂</div><div class="t-body">';
                cats.forEach(function (c) {
                    const timing = c.timing ? ' <span class="t-conviction">(' + escapeHtml(c.timing) + ')</span>' : '';
                    const cite = (c.citations || []).map(function (ci) { return citeLabel(ci); }).join('');
                    html += '<div class="t-point">' + escapeHtml(c.catalyst || '') + timing + '<span class="t-cite">' + cite + '</span></div>';
                });
                html += '</div></div>';
            }

            // 参考文献
            const allCites = new Set();
            [].concat(thesis, risks, cats).forEach(function (item) {
                (item.citations || []).forEach(function (c) {
                    const idx = citeIndex(c);
                    if (idx && idx > 0) allCites.add(idx);
                });
            });
            // 收集四维卡片的引用
            if (dims && typeof dims === 'object') {
                Object.values(dims).forEach(function (dim) {
                    if (dim && dim.points) {
                        dim.points.forEach(function (p) {
                            (p.citations || []).forEach(function (c) {
                                const idx = citeIndex(c);
                                if (idx && idx > 0) allCites.add(idx);
                            });
                        });
                    }
                });
            }
            if (allCites.size > 0 && sources.length > 0) {
                html += '<div class="t-refs"><h4>参考文献</h4><ol>';
                const sortedCites = Array.from(allCites).sort(function (a, b) { return a - b; });
                sortedCites.forEach(function (idx) {
                    const src = sources[idx - 1]; // 1-based
                    if (!src) return;
                    const title = src.title || src.url || '来源 ' + idx;
                    if (src.type === 'structured') {
                        html += '<li><span class="t-ref-structured">' + escapeHtml(title) + '（结构化数据）</span></li>';
                    } else if (src.url) {
                        html += '<li><a href="' + attrEscape(src.url) + '" target="_blank" rel="noopener">' + escapeHtml(title) + '</a></li>';
                    } else {
                        html += '<li>' + escapeHtml(title) + '</li>';
                    }
                });
                html += '</ol></div>';
            }

            box.style.display = 'block';
            box.innerHTML = html;

        const NA_HTML = '<span class="cell-na">—</span>';
        function fmtUsdBig (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
            return '$' + n.toFixed(2);
        }
        function fmtUsdPrice (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
            if (n >= 1) return '$' + n.toFixed(2);
            if (n >= 0.01) return '$' + n.toFixed(4);
            return '$' + n.toFixed(6);
        }
        function fmtNumberBig (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return Math.round(n).toLocaleString();
        }
        function fmtPct (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            return n.toFixed(2) + '%';
        }
        function fmtScore (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            return n.toFixed(1);
        }
        function formatTimeAgo (t) {
            if (!t) return '';
            const d = new Date(t);
            if (isNaN(d.getTime())) return String(t).slice(0, 16);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (diff < 60) return Math.round(diff) + ' 秒前';
            if (diff < 3600) return Math.round(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.round(diff / 3600) + ' 小时前';
            if (diff < 86400 * 7) return Math.round(diff / 86400) + ' 天前';
            return d.toISOString().slice(0, 10);
        }
        function fmtNumber (v) {
            if (v === null || v === undefined || v === '') return NA_HTML;
            const n = Number(v);
            if (isNaN(n)) return NA_HTML;
            return Math.round(n).toLocaleString();
        }
        function fmtCell (v, format) {
            switch (format) {
                case 'usd_big': return fmtUsdBig(v);
                case 'usd_price': return fmtUsdPrice(v);
                case 'number_big': return fmtNumberBig(v);
                case 'pct': return fmtPct(v);
                case 'score': return fmtScore(v);
                case 'number': return fmtNumber(v);
                default: return v !== null && v !== undefined && v !== '' ? String(v) : NA_HTML;
            }
        }
        function cellValue (v) {
            if (v === null || v === undefined || v === '') return -Infinity;
            const n = Number(v);
            return isNaN(n) ? -Infinity : n;
        }

        function fmtMetricValue (v, unit) {
            if (v === null || v === undefined) return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            if (unit === '%') return n.toFixed(2) + '%';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return Math.round(n).toLocaleString();
        }

        function buildSparkline (points, valueKey, color) {
            const w = 400, h = 48, pad = 2;
            const values = points.map(function (p) { return p[valueKey]; });
            const valid = values.filter(function (v) { return v !== null && v !== undefined; });
            if (valid.length < 2) return '';

            const min = Math.min.apply(null, valid);
            const max = Math.max.apply(null, valid);
            const range = max - min || 1;

            // 生成路径点（跳过 null 值，断开线）
            let pathD = '';
            let started = false;
            const stepX = (w - pad * 2) / (points.length - 1 || 1);
            points.forEach(function (p, i) {
                const v = p[valueKey];
                if (v === null || v === undefined) {
                    started = false;
                    return;
                }
                const x = pad + i * stepX;
                const y = pad + (h - pad * 2) * (1 - (v - min) / range);
                if (!started) {
                    pathD += 'M' + x.toFixed(1) + ',' + y.toFixed(1);
                    started = true;
                } else {
                    pathD += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
                }
            });

            // 面积填充（从最后一点到底部）
            const lastIdx = points.length - 1;
            const firstValidIdx = values.findIndex(function (v) { return v !== null && v !== undefined; });
            let areaD = '';
            if (firstValidIdx >= 0) {
                const fx = pad + firstValidIdx * stepX;
                const fy = pad + (h - pad * 2) * (1 - (valid[0] - min) / range);
                const lx = pad + lastIdx * stepX;
                const ly = pad + (h - pad * 2) * (1 - (valid[valid.length - 1] - min) / range);
                areaD = 'M' + fx.toFixed(1) + ',' + (h - pad).toFixed(1) +
                    ' L' + fx.toFixed(1) + ',' + fy.toFixed(1) +
                    ' ' + pathD.replace(/^M/, 'L') +
                    ' L' + lx.toFixed(1) + ',' + (h - pad).toFixed(1) + ' Z';
            }

            return '<svg class="ct-spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
                '<path d="' + areaD + '" fill="' + color + '" fill-opacity="0.1" />' +
                '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="1.5" />' +
                '</svg>';
        }

        function formatUsdBig (v) {
            if (v === null || v === undefined) return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            const abs = Math.abs(n);
            const sign = n < 0 ? '-' : '';
            if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'B';
            if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
            if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
            return sign + '$' + abs.toFixed(2);
        }

            html += '<div class="wfs-label">' + escapeHtml(signal.stance_label || stance) + '</div>';

            // 因子明细

                html += '<div class="wf-factors">';

                    const w = f.weight || 0;
                    const s = f.score || 0;
                    const ratio = w > 0 ? Math.min(1, Math.abs(s) / w) : 0;
                    const pct = ratio * 50;
                    const fillStyle = f.bullish
                        ? ('left:50%;width:' + pct + '%;')

                    html += '<div class="wff-name">' + escapeHtml(f.name) + '</div>';

                    html += '<div class="wff-value ' + (f.bullish ? 'bullish' : 'bearish') + '">' + escapeHtml(f.value) + '</div>';

                html += '<div class="wf-tiers">';

                    html += '<div class="wf-metric"><div class="wfm-label">24h 净流出交易所</div><div class="wfm-value ' + cls(net) + '">' + (net >= 0 ? '+' : '') + formatUsdBig(net) + '</div></div>';
                    html += '<div class="wf-metric"><div class="wfm-label">7d 净流出交易所</div><div class="wfm-value ' + (t7 ? cls(t7.net_exchange_flow) : '') + '">' + (t7 ? (t7.net_exchange_flow >= 0 ? '+' : '') + formatUsdBig(t7.net_exchange_flow) : '—') + '</div></div>';
