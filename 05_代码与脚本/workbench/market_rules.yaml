# 大盘模块规则外置（P2-4 所有评分/背离阈值全外置于此文件）
# 本文件由 macro_market.py / ethbtc_market.py 在启动时加载，缺失或解析失败时回退内置默认值，不影响运行。
# 改 yaml 阈值后需重启生效（不支持热更新）。

# ── P0-3 情绪子分权重（和 = 1.0） ──
emotion_weights:
  fear_greed: 0.40       # 恐贪指数
  altcoin_season: 0.20   # 山寨季指数
  cefi: 0.20             # CEFI 指数
  derivative: 0.20       # 衍生品极值

# ── P0-3 结构子分权重（和 = 1.0） ──
structure_weights:
  market_cap: 0.25       # 体量（总市值）
  price_action: 0.25     # 盘面（BTC/ETH 技术面）
  institution: 0.25      # 机构（ETF 等）
  sector: 0.25           # 板块轮动

# ── P2-1 极端区阈值（百分位 > high / < low → 极端标记） ──
extreme_zone:
  high_pct: 90           # 百分位 > 90% → HIGH
  low_pct: 10            # 百分位 < 10% → LOW

# ── P1-1 叙事榜 / 链榜配置 ──
narrative_chain:
  narrative_top_n: 15    # 最多拉取 detail 聚合的叙事数（受 CMC 限流约束）
  tvl_leg_min: 50000000  # TVL 腿阈值：低于此视为无有效 TVL，仅用市值变化
  chain_top_n: 30        # 链榜扫描的 top 链数（按当前 TVL）
  mcap_weight: 0.5       # 合成叙事榜：市值变化权重
  tvl_weight: 0.5        # 合成叙事榜：TVL 变化权重
  rank_limit: 10         # 合成叙事榜最终取前 N

# ── P0-2 ETH/BTC 风险偏好阈值（30d 变化率 %） ──
ethbtc_risk:
  expansion_threshold: 5.0    # > +5% → 风险偏好扩张
  flight_threshold: -5.0      # < -5% → 避险回流 BTC

# ── P1-2 背离检测阈值 ──
divergence_thresholds:
  oi_surge_pct: 30.0            # OI 7d 变化 > +30% = 暴增（杠杆过热）
  oi_flat_pct: 10.0             # OI 7d 变化 < +10% = 平稳（现货推动）
  oi_drop_pct: -10.0            # OI 7d 变化 < -10% = 明显收缩（去杠杆）
  price_up_pct: 1.0             # 7d 价涨判定
  price_down_pct: -1.0          # 7d 价跌判定
  funding_extreme: 0.0005       # 单期 funding(8h) 绝对值 > 0.05% = 极端
  price_stagnation_pct: 5.0     # 7d 价变化 < 5% 视为滞涨
  stablecoin_flow_min_usd: 5000000000   # 稳定币 7d 净流显著阈值（50 亿美元）
  corr_strong: 0.6              # 30d Pearson |r| > 0.6 强耦合
  corr_decouple: 0.2            # 30d Pearson r < 0.2 脱钩
  corr_prior: 0.5               # 60d 历史相关性基线（曾强相关）

# ── P1-4 机会评分 / 置信度共振规则 ──
opportunity_rules:
  narrative_min_composite: 8.0          # 叙事入榜最小合成分（低于视为弱信号）
  narrative_top_n: 3                    # 叙事机会最多取前 N
  chain_min_flow_usd: 200000000         # 链 7d 净流入阈值（2 亿美元）
  chain_min_flow_pct: 3.0               # 链 7d 净流入百分比阈值
  chain_top_n: 3                        # 链机会最多取前 N
  stablecoin_flow_min_usd: 5000000000   # 稳定币净流入显著阈值（50 亿美元）
  emotion_fear_max: 50                  # 恐贪 < 50 视为恐惧（左侧信号）
  resonance_high_min_sources: 2         # 高置信最少独立源类型数
  resonance_min_source_count: 2          # 共识动量最少独立数据源数（source_count ≥ 2）
  resonance_consensus_top_n: 50          # 扫描共识榜前 N
  resonance_max_results: 10              # 共振榜最多返回条数
  push_confidence_threshold: medium     # 默认只推 高+中（low 剔除，语义由 conviction 承接）
  conviction_high_min: 70               # conviction ≥70 → HIGH 置顶（从 75 降至 70，让第二刀高 conv 信号进 HIGH）
  conviction_med_min: 55                # conviction ≥55 → MED（观察池），<55 → LOW 剔除
  # P0-2 修复：低覆盖资产放宽 MED 阈值，避免数据饿死导致 0 机会
  conviction_med_min_low_coverage: 50   # 可用轴权重 < min_available_weight 时 MED 阈值
  min_available_weight: 0.5             # 可用轴权重和低于此值视为覆盖度不足
  # 第二刀新增阈值
  fng_fear_max: 25                      # 恐贪 ≤25 → 极度恐惧 long 信号
  fng_greed_min: 75                     # 恐贪 ≥75 → 极度贪婪 short 信号
  stablecoin_inflow_min: 5000000000     # 稳定币 7d 净流 ≥50 亿刀 → 弹药积累
  protocol_top_n: 3                     # P1-3 新协议 TVL 异动取前 N
  exchange_netflow_min_usd: 100000000   # 交易所净流出触发 long 信号最小阈值（1 亿美元）
  # P0-3 conviction 各轴权重（总和 = 1.0，7 轴含 catalyst）
  conviction_weight_mvrv: 0.23
  conviction_weight_cycle: 0.18
  conviction_weight_funding: 0.14
  conviction_weight_netflow: 0.14
  conviction_weight_stable: 0.09
  conviction_weight_roi: 0.14
  conviction_weight_catalyst: 0.08     # P0-2 临时保持 0.08：P0-1 回测无 HIGH 样本（MED=29/LOW=481），无法按 tier 校准；待本刀数据轴扩建后 score 分布改善、回测出现 HIGH 档再校准
  # P0-B 催化剂因子
  catalyst_window_days: 14             # 催化剂回溯窗口（天）
  catalyst_min_score: 50               # 独立强事件机会类入场门槛；进评分轴按权重比例贡献不限此阈值
  # FEAT-HIGHLIGHT-003 第三刀：评分重构
  conviction_resonance_step: 6        # 每多 1 个独立确认源 +6 分
  conviction_resonance_cap: 18        # 共振加分上限
  mvrv_deep_strength_base: 60
  mvrv_deep_strength_per_pct: 2.0     # 每低 1 个百分位 +2
  mvrv_deep_strength_per_coin: 3
  mvrv_deep_strength_cap: 12          # 广度加分上限
  fng_strength_base: 50
  fng_strength_span: 50               # 距中性 50 越远分越高
  leverage_strength_base: 70
  leverage_strength_k: 20000          # |funding| 放大系数
  stablecoin_strength_base: 58
  stablecoin_strength_per_1b: 3       # 每超 50 亿刀 1B +3
  catalyst_top_n: 5                    # 催化剂机会最多取前 N（去重后）
  # ── 高亮信号板块接入（2026-09-01 工单集合） ──
  # 工单1: 链上巨鲸异常
  whale_window_hours: 24               # 巨鲸回看窗口（小时）
  whale_usd_min: 1000000               # 单笔最低美元（默认 100 万刀）
  whale_top_n: 5                       # 最多展示巨鲸卡数
  # 工单3: GitHub dev 活跃异动
  github_window_days: 60               # 拉取新鲜度窗口（天）
  github_burst_ratio: 1.5              # last4 > 1.5*prev4 → 爆发
  github_decline_ratio: 0.5            # last4 < 0.5*prev4 → 骤降
  github_top_n: 5
  # 工单4: 融资落地
  raise_window_days: 90                # 融资回看窗口（天，低频用 90d 避免空板）
  raise_top_n: 5
  # 工单5: 代币解锁抛压
  unlock_window_days: 14               # 未来解锁窗口（天）
  unlock_ratio_min: 1.0                # unlock_ratio_mcap 最小阈值（%）
  unlock_top_n: 5
  # 工单6: KOL onchain 情报
  kol_window_days: 7                   # KOL 信号回看窗口（天）
  kol_top_n: 5
  # FEAT-HIGHLIGHT-001: 高亮信号精选
  highlight_max_total: 10              # 高亮信号总数上限

# ── 评分微调参数（scoring tuning） ──
scoring_tuning:
  # 衍生品 funding 极值评分映射
  funding_extreme_abs: 0.001      # |funding| > 0.001 → 极端
  funding_high_abs: 0.0005        # |funding| > 0.0005 → 偏极端
  funding_extreme_bull: 80        # 多头过热极端分
  funding_extreme_bear: 20        # 空头过热极端分
  funding_high_bull: 65           # 多头过热偏极端分
  funding_high_bear: 35           # 空头过热偏极端分
  funding_neutral: 50             # 中性分

  # 体量（总市值）评分步进
  mcap_step: 40000000000          # 40B 步进

  # 盘面 RSI 线性映射
  rsi_base: 50                    # RSI 中性基准
  rsi_slope: 0.8                  # RSI→分数映射斜率
  ma20_bonus: 5                   # 价格 > MA20 加分
  ma50_bonus: 5                   # 价格 > MA50 加分

  # ETF 资金流分级阈值（USD millions）
  etf_flow_high: 100              # 净流入 > 100M → 80 分
  etf_flow_low: -100              # 净流入 < -100M → 20 分
  etf_score_inflow_high: 80
  etf_score_inflow: 60
  etf_score_outflow: 40
  etf_score_outflow_high: 20

  # 板块评分
  sector_base: 50                 # 板块中性基准
  sector_slope: 5                 # avg_change→分数映射斜率

  # 可用权重阈值（低于此 → warning）
  min_available_weight: 0.4

# ── Meme 五维风险标签（MEME-04）──
meme_risk:
  # 五轴加权（归一化到 Σ=1.0）
  weights:
    contract: 0.30      # 合约安全（honeypot/增发/冻结/风险分）
    liquidity: 0.25     # 流动性（DEX TVL + CEX 列表）
    holder: 0.20        # 筹码集中度（鲸鱼变化 + 持仓变化）
    lifecycle: 0.15     # 生命周期（launch_date 年龄分桶）
    social: 0.10        # 社交热度（KOL 信号 + GitHub 活跃度，代理源）
  # 一票否决标记（命中 → risk_label=block, total_score=100）
  block_flags:
    - is_honeypot
    - mint_authority
    - freeze_authority
  # 各轴阈值
  contract:
    red: 70
    yellow: 40
  liquidity:
    red: 70
    yellow: 40
    min_usd: 100000         # total_liquidity_usd < 此 → red
    top_pool_pct: 80        # 单池占比 > 此 → 红旗
  holder:
    red: 70
    yellow: 40
    whale_inflow_pct: 3.0   # 鲸鱼 7d 增持 > 3% → red
  lifecycle:
    age_buckets:
      red_max: 7            # <7 天 → red
      yellow_max: 30        # 7-30 天 → yellow
      green_min: 90         # ≥90 天 → green
  social:
    red: 70
    yellow: 40
    kol_max_count: 5      # 近 30 天 KOL 信号 ≥5 → 高关注(低分)；0 → dead_kol
    gh_min_activity: 5    # 近 30 天 GitHub 活跃 ≥5 → active(低分)；0 → dead_github
    # 方向语义 A：死盘/零社交=风险(高分)，活跃=正面(低分)，取各渠道最活跃值

# ── Meme insider 网络聚类（MEME-07）──
insider_cluster:
  top_n_networks: 5
  dominance_high: 0.20        # insider 最大网络持币占比 > 20% → high
  dominance_medium: 0.10      # 10~20% → medium
  account_ratio_high: 0.30   # insider 账户占全 holder > 30% → high
  account_ratio_medium: 0.15
  bundle_token_amount_pct: 0.05  # size<=10 网络持币 > top 5% → bundle_flag
  # 多信号加权：high 若任一 high 信号；medium 若任一 medium；否则 clean

# ── Meme 四阶段生命周期（MEME-05）──
meme_lifecycle:
  thresholds:
    launch_max_days: 14      # <14 天 → launch（需流动性起量）
    bloom_max_days: 60       # 14-60 天 → bloom（需高流动性+高热度）
    old_no_social_days: 90   # >90 天无社交热度 → decay
    liq_launch_min: 10000    # launch 阶段最低流动性 $10K
    liq_bloom_min: 50000     # bloom 阶段最低流动性 $50K
    liq_decay_max: 5000      # 流动性 <$5K → decay
    social_hot_min: 2        # 30d 内 KOL/GitHub 信号 ≥2 → 有热度
    holder_bleed_max: -10    # holder 30d 变化 ≤-10% → 流失
