[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:gunicorn]
command=gunicorn app:app --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

[program:scheduler]
command=python /app/scheduler.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=5

[program:kol_daemon]
command=python /app/kol_daemon.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5

# 大额转账监控守护进程：从 scheduler 任务队列剥离（不再占用 chain 并发槽位），
# 改为独立常驻进程整轮扫描。每轮间隔由 TRANSFER_MONITOR_INTERVAL 控制（默认 300s）。
[program:chain_transfer_monitor]
command=python /app/scripts/bin/phase_chain_transfer_monitor_auto.py --daemon
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5

[program:scheduler_watchdog]
command=python /app/scheduler_watchdog.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=5
