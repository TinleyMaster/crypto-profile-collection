[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:gunicorn]
command=gunicorn app:app --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3

[program:scheduler]
command=python /app/scheduler.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=5

[program:kol_daemon]
command=python /app/kol_daemon.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5

# 大额转账监控守护进程：从 scheduler 任务队列剥离（不再占用 chain 并发槽位），
# 改为独立常驻进程整轮扫描。每轮间隔由 TRANSFER_MONITOR_INTERVAL 控制（默认 300s）。
[program:chain_transfer_monitor]
command=python /app/scripts/bin/phase_chain_transfer_monitor_auto.py --daemon
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=5

[program:scheduler_watchdog]
command=python /app/scheduler_watchdog.py
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=5

# 盘面异动扫描·清算事件订阅（已停用，2026-09-21）
#
# 停用原因（审计 §12.1-2）：Binance 的 allForceOrders 接口已 404 下线，
# 全市场 !forceOrder@arr 流长期无产出——biz.liquidation_events 至今 0 行，
# 而进程一直在跑、看上去"在采集"。爆仓维已完全由 CoinGlass 滚动快照承接
# （scan_daemon 的 scan_liquidation → biz.liquidation_snapshot），本通路无补充价值。
# 脚本与表均保留（phase_liquidation_collector.py / biz.liquidation_events），
# 若日后确认 Binance 恢复广播可再启用。
#
# [program:liquidation_collector]
# command=python /app/scripts/bin/phase_liquidation_collector.py
# directory=/app
# stdout_logfile=/dev/stdout
# stdout_logfile_maxbytes=0
# stderr_logfile=/dev/stderr
# stderr_logfile_maxbytes=0
# autorestart=true
# startretries=3
# startsecs=5

# 盘面异动扫描守护进程（scan_daemon）：从 scheduler 剥离的高频扫描任务统一常驻
# 包含：K线增量(5min)、OI/CVD采样(5min)、主池扫描(15min)、蓄势池(30min)、告警(5min)、watchlist监控(30min)
# 单进程多线程调度，共享 DB 连接池和 HTTP session，内存从 ~700MB 降到 ~120MB
# 部署在美国节点（独立出口，不与新加坡主节点共享 IP）
# stopasgroup/killasgroup：停止/重启时把信号打给整个进程组，确保其派生的子进程
# 一并退出——否则残留子进程会一直占着单实例 advisory 锁，让新实例永远起不来
# （2026-09-18 停摆 63h、2026-09-21 停摆 48min 的共同放大器）。
[program:scan_daemon]
command=python /app/scripts/bin/scan_daemon.py --min-vol-usd 5000000
directory=/app
# 日志落盘而非 /dev/stdout（2026-09-21 决策）：
#   ① 容器日志设施断开时 /dev/stdout 会变成「已关闭文件」，daemon 每轮首行 print 抛
#      ValueError 被 except 吞掉 → 业务零写入而心跳照常推进（09-21 停摆 48min 的根因）。
#      写文件后日志链路故障与业务彻底解耦（scan_daemon 内的 _harden_streams 仅作兜底）。
#   ② /dev/stdout 下 supervisord 没有可 tail 的文件，`supervisorctl tail` 永久不可用。
# 落盘路径用 /app（镜像内必然存在且可写），避免引入「目录不存在 → 启动失败 → FATAL」新风险。
stdout_logfile=/app/scan_daemon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/app/scan_daemon.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=2
autorestart=true
startretries=3
startsecs=10
stopasgroup=true
killasgroup=true

# 催化剂快通道守护进程：从 scheduler 剥离，独立常驻，每 15 分钟一次快通道
# L1分类→G0环境→G1分级→G2共振→G6信号→A级即时推送
# 部署在美国节点（与 scan_daemon 同节点，共享 DB 连接）
[program:catalyst_fast_daemon]
command=python /app/scripts/bin/catalyst_fast_daemon.py --interval 900 --offset 120
directory=/app
# 同 scan_daemon：日志落盘（理由见上），便于 `supervisorctl tail` 与容器日志故障解耦
stdout_logfile=/app/catalyst_fast_daemon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/app/catalyst_fast_daemon.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=2
autorestart=true
startretries=3
startsecs=10
