<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键投研</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #0f1115;
            color: #e6e8eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        a {
            color: #60a5fa;
        }

        .r-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid #1e222a;
            background: #12151b;
            flex-shrink: 0;
        }

        .r-title {
            font-size: 15px;
            font-weight: 600;
        }

        .r-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .r-actions button {
            background: #374151;
            color: #d1d5db;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .r-actions button:hover {
            background: #4b5563;
        }

        .r-body {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .r-sidebar {
            width: 360px;
            border-right: 1px solid #1e222a;
            overflow-y: auto;
            padding: 16px;
            background: #12151b;
            flex-shrink: 0;
        }

        .r-sidebar h3 {
            font-size: 12px;
            color: #8a92a0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 16px 0 8px;
        }

        .r-sidebar h3:first-child {
            margin-top: 0;
        }

        .r-missing-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            background: #171a21;
            border: 1px solid #1e222a;
        }

        .r-missing-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .r-missing-item .dot.ok {
            background: #10b981;
        }

        .r-missing-item .dot.miss {
            background: #dc2626;
        }

        .r-group {
            border: 1px solid #1e222a;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #171a21;
            overflow: hidden;
        }

        .r-group-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            font-weight: 500;
        }

        .r-group-head:hover {
            background: #1c2129;
        }

        .r-group-head .chev {
            margin-left: auto;
            color: #8a92a0;
            font-size: 11px;
            transition: transform .15s;
        }

        .r-group.open .r-group-head .chev {
            transform: rotate(90deg);
        }

        .r-group-head .cnt {
            color: #6b7280;
            font-size: 11px;
            font-weight: 400;
        }

        .r-group-body {
            display: none;
            border-top: 1px solid #1e222a;
            padding: 8px;
        }

        .r-group.open .r-group-body {
            display: block;
        }

        .r-src {
            margin-bottom: 8px;
        }

        .r-src:last-child {
            margin-bottom: 0;
        }

        .r-src-head {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            word-break: break-all;
        }

        .r-src-head a {
            text-decoration: none;
            color: #9ca3af;
            flex: 1;
        }

        .r-src-head a:hover {
            text-decoration: underline;
            color: #e6e8eb;
        }

        .r-src-head .r-content-btn {
            background: #272d38;
            color: #9ca3af;
            border: none;
            border-radius: 5px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
        }

        .r-src-head .r-content-btn:hover {
            background: #374151;
        }

        .r-src-head .r-src-date {
            color: #6b7280;
            font-size: 11px;
            flex-shrink: 0;
            white-space: nowrap;
            margin-top: 1px;
        }

        .r-src-content {
            margin-top: 6px;
            padding: 8px 10px;
            background: #0d1014;
            border: 1px solid #1e222a;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            color: #b8bec7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 240px;
            overflow-y: auto;
        }

        .r-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .r-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .r-msg {
            max-width: 760px;
            margin-bottom: 16px;
        }

        .r-msg-role {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .r-msg-content {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .r-msg.user .r-msg-content {
            background: #1c2533;
            border-color: #2b3a52;
        }

        .r-citations {
            margin-top: 8px;
            font-size: 11px;
            color: #8a92a0;
        }

        .r-citations a {
            color: #60a5fa;
            text-decoration: none;
        }

        .r-citations a:hover {
            text-decoration: underline;
        }

        .r-cite {
            display: block;
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid #2a2f3a;
        }

        .r-thesis {
            flex-shrink: 0;
            max-height: 42%;
            overflow-y: auto;
            margin: 16px 20px 0;
            padding: 14px 16px;
            background: #14181f;
            border: 1px solid #1e222a;
            border-radius: 10px;
        }

        .r-thesis .t-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .r-thesis .t-stance {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
        }

        .r-thesis .t-conviction {
            font-size: 11px;
            color: #8a92a0;
        }

        .r-thesis .t-section {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 10px 0 4px;
        }

        .r-thesis .t-point {
            font-size: 13px;
            line-height: 1.6;
            margin: 4px 0;
            padding-left: 10px;
            border-left: 2px solid #2a2f3a;
        }

        .r-thesis .t-cite {
            color: #60a5fa;
            font-size: 11px;
            margin-left: 4px;
        }

        .r-thesis .t-empty {
            color: #6b7280;
            font-size: 13px;
        }

        .r-thesis .t-metrics {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .r-thesis .t-gen-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .r-thesis .t-gen-btn:hover {
            background: #2563eb;
        }

        .r-thesis .t-gen-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        /* 竞品对比 */
        .r-competitors {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .r-competitors .c-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .r-competitors .c-head h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .r-competitors .c-sector {
            font-size: 12px;
            color: #fbbf24;
        }

        .r-competitors .c-table-wrap {
            overflow-x: auto;
        }

        .r-competitors table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }

        .r-competitors th,
        .r-competitors td {
            padding: 8px 10px;
            text-align: right;
            border-bottom: 1px solid #1e222a;
            white-space: nowrap;
        }

        .r-competitors th:first-child,
        .r-competitors td:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            background: #171a21;
            z-index: 1;
        }

        .r-competitors th {
            color: #8a92a0;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            user-select: none;
        }

        .r-competitors th:hover {
            color: #e6e8eb;
        }

        .r-competitors tr.target-row td {
            background: rgba(59, 130, 246, 0.08);
            font-weight: 600;
        }

        .r-competitors tr.target-row td:first-child {
            background: rgba(59, 130, 246, 0.12);
        }

        .r-competitors td .coin-sym {
            color: #e6e8eb;
            font-weight: 500;
        }

        .r-competitors td .coin-name {
            color: #6b7280;
            font-size: 11px;
            margin-left: 4px;
        }

        .r-competitors .c-empty {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .r-competitors .c-loading {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* 背离检测 */
        .r-divergence {
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .r-divergence .d-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .r-divergence .d-head h3 {
            font-size: 14px;
            font-weight: 600;
        }

        .r-divergence .d-signal {
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .r-divergence .d-signal.bearish {
            background: rgba(239, 68, 68, 0.08);
            border-color: #ef4444;
        }

        .r-divergence .d-signal.bullish {
            background: rgba(16, 185, 129, 0.08);
            border-color: #10b981;
        }

        .r-divergence .d-signal .d-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .r-divergence .d-signal.bearish .d-title {
            color: #f87171;
        }

        .r-divergence .d-signal.bullish .d-title {
            color: #34d399;
        }

        .r-divergence .d-signal .d-severity {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 500;
        }

        .r-divergence .d-signal.bearish .d-severity.high {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .r-divergence .d-signal.bearish .d-severity.medium {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        .r-divergence .d-signal.bullish .d-severity.high {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .r-divergence .d-signal.bullish .d-severity.medium {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
        }

        .r-divergence .d-signal .d-desc {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .r-divergence .d-signal .d-conds {
            font-size: 11px;
        }

        .r-divergence .d-signal .d-cond {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 0;
        }

        .r-divergence .d-signal .d-cond .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .r-divergence .d-signal .d-cond.matched .dot {
            background: currentColor;
        }

        .r-divergence .d-signal .d-cond.unmatched .dot {
            background: #374151;
        }

        .r-divergence .d-signal .d-cond.unmatched {
            color: #6b7280;
        }

        .r-divergence .d-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1e222a;
        }

        .r-divergence .d-metric {
            text-align: center;
        }

        .r-divergence .d-metric .dm-label {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .r-divergence .d-metric .dm-value {
            font-size: 13px;
            font-weight: 600;
            color: #e6e8eb;
        }

        .r-divergence .d-empty {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 16px;
        }

        .r-divergence .d-loading {
            color: #6b7280;
            font-size: 13px;
            text-align: center;
            padding: 16px;
        }

        .r-input {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            border-top: 1px solid #1e222a;
            background: #12151b;
            flex-shrink: 0;
        }

        .r-input textarea {
            flex: 1;
            resize: none;
            height: 60px;
            background: #171a21;
            border: 1px solid #1e222a;
            border-radius: 10px;
            color: #e6e8eb;
            font-size: 14px;
            padding: 12px 14px;
            outline: none;
            font-family: inherit;
        }

        .r-input textarea:focus {
            border-color: #3b82f6;
        }

        .r-input button {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .r-input button:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .no-data {
            color: #6b7280;
            font-size: 12px;
            padding: 8px 0;
        }
    </style>
</head>

<body>
    <header class="r-header">
        <div class="r-title" id="r-title">🤖 一键投研</div>
        <div class="r-actions">
            <button id="r-fill-btn" onclick="fillMissing()">补齐缺失</button>
            <button onclick="window.close()">关闭</button>
        </div>
    </header>
    <div class="r-body">
        <aside class="r-sidebar" id="r-sidebar">
            <div class="no-data">加载中...</div>
        </aside>
        <section class="r-chat">
            <div class="r-thesis" id="r-thesis" style="display:none"></div>
            <div class="r-competitors" id="r-competitors" style="display:none">
                <div class="c-head">
                    <h3>🏆 同赛道竞品对比</h3>
                    <span class="c-sector" id="c-sector-label"></span>
                </div>
                <div id="c-table-container">
                    <div class="c-loading">加载中...</div>
                </div>
            </div>
            <div class="r-divergence" id="r-divergence" style="display:none">
                <div class="d-head">
                    <h3>📡 背离信号检测</h3>
                    <span style="font-size:11px;color:#6b7280">情绪 × 价格 × 链上</span>
                </div>
                <div id="d-signals-container">
                    <div class="d-loading">加载中...</div>
                </div>
            </div>
            <div class="r-messages" id="r-messages"></div>
            <div class="r-input">
                <textarea id="r-question" placeholder="输入问题，回答将严格基于已收集资料并标注来源...（Enter 发送，Shift+Enter 换行）"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askResearchQuestion();}"></textarea>
                <button id="r-ask-btn" onclick="askResearchQuestion()">发送</button>
            </div>
        </section>
    </div>

    <script>
        const ASSET_ID = {{ asset_id }};
        let researchNotebookId = null;
        let researchAsking = false;
        let filling = false;

        function escapeHtml (s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }
        function attrEscape (s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function sleep (ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        async function safeJson (res, url) {
            if (!res.ok) {
                let detail = '';
                try { detail = (await res.text()).slice(0, 200); } catch (e) { }
                throw new Error('服务器错误 ' + res.status + (detail ? '（' + detail + '）' : ''));
            }
            const text = await res.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                throw new Error('服务器返回异常响应: ' + text.slice(0, 200));
            }
        }

        async function waitForTask (taskId, maxWait = 600000) {
            const start = Date.now();
            while (Date.now() - start < maxWait) {
                await sleep(2000);
                let data;
                try {
                    const res = await fetch('/api/tasks/' + taskId);
                    data = await safeJson(res, '/api/tasks/' + taskId);
                } catch (e) {
                    continue;
                }
                if (data.ok && data.task && data.task.status !== 'pending' && data.task.status !== 'running') {
                    return;
                }
            }
        }

        // ── 加载笔记本 ──
        async function loadNotebook (refresh) {
            try {
                let url = '/api/research/' + ASSET_ID + '/notebook';
                if (refresh) url += '?refresh=1';
                const res = await fetch(url);
                const data = await safeJson(res, url);
                if (!data.ok || !data.data) throw new Error(data.error || '打开失败');
                researchNotebookId = data.data.notebook_id;
                render(data.data);
            } catch (e) {
                document.getElementById('r-title').textContent = '🤖 一键投研';
                document.getElementById('r-sidebar').innerHTML = '<div class="no-data">打开失败: ' + escapeHtml(e.message) + '</div>';
                document.getElementById('r-messages').innerHTML = '<div class="no-data">打开失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        async function fillMissing () {
            if (filling) return;
            if (!confirm('将针对缺失项自动补齐投研资料（可能耗时较长），是否继续？')) return;
            filling = true;
            const btn = document.getElementById('r-fill-btn');
            btn.disabled = true;
            btn.textContent = '补齐中...';
            try {
                const res = await fetch('/api/research/' + ASSET_ID + '/fill-missing', { method: 'POST' });
                const data = await safeJson(res, '/api/research/' + ASSET_ID + '/fill-missing');
                if (!data.ok) throw new Error(data.error || '启动失败');

                await waitForTask(data.task_id, 1800000); // 最长 30 分钟

                const resultRes = await fetch('/api/tasks/' + data.task_id + '/result');
                const resultData = await safeJson(resultRes, '/api/tasks/' + data.task_id + '/result');

                let msg = '补齐完成';
                if (resultData.pending) {
                    msg = '补齐仍在后台进行中，可稍后重新打开本页查看最新进度。';
                } else if (resultData.ok && resultData.result && resultData.result.ok) {
                    const d = resultData.result.data || {};
                    msg = d.message || msg;
                    if (d.filled && d.filled.length) {
                        msg += '\n\n本次补齐：' + d.filled.map(function (x) { return x.label; }).join('、');
                    }
                    if (d.still_missing && d.still_missing.length) {
                        msg += '\n\n仍缺失：' + d.still_missing.map(function (x) { return x.label; }).join('、');
                    }
                } else {
                    msg = '补齐失败：' + ((resultData.result && resultData.result.error) || resultData.error || '未知错误');
                }
                alert(msg);
                await loadNotebook(true); // 强制重采快照
            } catch (e) {
                alert('补齐失败: ' + e.message);
                await loadNotebook(true);
            }
            filling = false;
            btn.disabled = false;
            btn.textContent = '补齐缺失';
        }

        function render (d) {
            const title = d.title || '一键投研';
            document.getElementById('r-title').textContent = '🤖 ' + title;
            document.title = title;
            renderThesis(d);
            renderSidebar(d);
            renderMessages(d.messages || []);
            loadCompetitors();
            loadDivergence();
        }

        function renderThesis (d) {
            const box = document.getElementById('r-thesis');
            const t = d.thesis;
            if (!t) {
                box.style.display = 'block';
                box.innerHTML = '<div class="t-empty">暂无研究结论</div>' +
                    '<div style="margin-top:8px"><button class="t-gen-btn" id="t-gen-btn" onclick="generateThesis()">生成研究结论</button></div>';
                return;
            }
            const stanceMap = {
                bullish: { label: '看多', bg: '#0b3d2a', color: '#34d399' },
                bearish: { label: '看空', bg: '#3d1616', color: '#f87171' },
                neutral: { label: '中性', bg: '#2a2f3a', color: '#9ca3af' }
            };
            const s = stanceMap[t.stance] || stanceMap.neutral;
            const convMap = { high: '高置信', medium: '中置信', low: '低置信' };
            let html = '<div class="t-head">' +
                '<span class="t-stance" style="background:' + s.bg + ';color:' + s.color + '">' + s.label + '</span>' +
                '<span class="t-conviction">' + (convMap[t.conviction] || t.conviction) + '</span>' +
                '<span style="margin-left:auto"><button class="t-gen-btn" onclick="generateThesis()">重新生成</button></span>' +
                '</div>';
            const thesis = t.thesis || [];
            if (thesis.length) {
                html += '<div class="t-section">核心论点</div>';
                thesis.forEach(function (p) {
                    const cite = (p.citations || []).map(function (c) { return '[' + c + ']'; }).join('');
                    html += '<div class="t-point">' + escapeHtml(p.point || '') + '<span class="t-cite">' + cite + '</span></div>';
                });
            }
            const km = t.key_metrics || {};
            const kmKeys = Object.keys(km);
            if (kmKeys.length) {
                html += '<div class="t-section">关键指标</div><div class="t-metrics">';
                kmKeys.forEach(function (k) {
                    html += '<div><strong>' + escapeHtml(k) + '</strong>: ' + escapeHtml(String(km[k])) + '</div>';
                });
                html += '</div>';
            }
            const risks = t.risks || [];
            if (risks.length) {
                html += '<div class="t-section">风险点</div>';
                risks.forEach(function (r) { html += '<div class="t-point">' + escapeHtml(r.risk || '') + '</div>'; });
            }
            const cats = t.catalysts || [];
            if (cats.length) {
                html += '<div class="t-section">催化剂</div>';
                cats.forEach(function (c) {
                    const timing = c.timing ? ' <span class="t-conviction">(' + escapeHtml(c.timing) + ')</span>' : '';
                    html += '<div class="t-point">' + escapeHtml(c.catalyst || '') + timing + '</div>';
                });
            }
            box.style.display = 'block';
            box.innerHTML = html;
        }

        async function generateThesis () {
            const btn = document.getElementById('t-gen-btn');
            if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
            try {
                const res = await fetch('/api/research/' + ASSET_ID + '/thesis', { method: 'POST' });
                const data = await safeJson(res, '/api/research/' + ASSET_ID + '/thesis');
                if (!data.ok) throw new Error(data.error || '启动失败');

                await waitForTask(data.task_id, 300000); // 最长 5 分钟

                const resultRes = await fetch('/api/tasks/' + data.task_id + '/result');
                const resultData = await safeJson(resultRes, '/api/tasks/' + data.task_id + '/result');
                if (resultData.ok && resultData.result && resultData.result.ok === false) {
                    throw new Error(resultData.result.error || '生成失败');
                }
                await loadNotebook(false);
            } catch (e) {
                alert('生成研究结论失败: ' + e.message);
                if (btn) { btn.disabled = false; btn.textContent = '生成研究结论'; }
            }
        }

        // ── 竞品对比 ──
        let compSortKey = 'market_cap';
        let compSortAsc = false;

        function fmtUsdBig (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
            return '$' + n.toFixed(2);
        }
        function fmtUsdPrice (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
            if (n >= 1) return '$' + n.toFixed(2);
            if (n >= 0.01) return '$' + n.toFixed(4);
            return '$' + n.toFixed(6);
        }
        function fmtNumberBig (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return Math.round(n).toLocaleString();
        }
        function fmtPct (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            return n.toFixed(2) + '%';
        }
        function fmtScore (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            return n.toFixed(1);
        }
        function fmtNumber (v) {
            if (v === null || v === undefined || v === '') return '—';
            const n = Number(v);
            if (isNaN(n)) return '—';
            return Math.round(n).toLocaleString();
        }
        function fmtCell (v, format) {
            switch (format) {
                case 'usd_big': return fmtUsdBig(v);
                case 'usd_price': return fmtUsdPrice(v);
                case 'number_big': return fmtNumberBig(v);
                case 'pct': return fmtPct(v);
                case 'score': return fmtScore(v);
                case 'number': return fmtNumber(v);
                default: return v !== null && v !== undefined ? String(v) : '—';
            }
        }
        function cellValue (v) {
            if (v === null || v === undefined || v === '') return -Infinity;
            const n = Number(v);
            return isNaN(n) ? -Infinity : n;
        }

        async function loadCompetitors () {
            const box = document.getElementById('r-competitors');
            const container = document.getElementById('c-table-container');
            box.style.display = 'block';
            container.innerHTML = '<div class="c-loading">加载中...</div>';

            try {
                const r = await fetch('/api/research/' + ASSET_ID + '/competitors?limit=8');
                const data = await safeJson(r, '/api/research/competitors');
                if (!data.ok) {
                    container.innerHTML = '<div class="c-empty">加载失败: ' + escapeHtml(data.error || '') + '</div>';
                    return;
                }

                const sectorLabel = document.getElementById('c-sector-label');
                sectorLabel.textContent = data.sector_label || '';

                const comps = data.competitors || [];
                const metrics = data.metrics || [];
                if (comps.length <= 1) {
                    container.innerHTML = '<div class="c-empty">同赛道暂无其他竞品数据</div>';
                    return;
                }

                renderCompetitorTable(comps, metrics);
            } catch (e) {
                container.innerHTML = '<div class="c-empty">网络错误: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderCompetitorTable (comps, metrics) {
            const container = document.getElementById('c-table-container');
            // 排序
            const sorted = [...comps].sort((a, b) => {
                const av = cellValue(a[compSortKey]);
                const bv = cellValue(b[compSortKey]);
                if (av === bv) return 0;
                return compSortAsc ? (av - bv) : (bv - av);
            });

            let html = '<div class="c-table-wrap"><table>';
            // 表头
            html += '<thead><tr><th>代币</th>';
            metrics.forEach(function (m) {
                const arrow = compSortKey === m.key ? (compSortAsc ? ' ↑' : ' ↓') : '';
                html += '<th onclick="sortCompetitors(\'' + escapeHtml(m.key) + '\')">' + escapeHtml(m.label) + arrow + '</th>';
            });
            html += '</tr></thead><tbody>';

            sorted.forEach(function (c) {
                const rowCls = c.is_target ? ' class="target-row"' : '';
                html += '<tr' + rowCls + '>';
                html += '<td><span class="coin-sym">' + escapeHtml(c.symbol) + '</span>' +
                    '<span class="coin-name">' + escapeHtml(c.name || '') + '</span></td>';
                metrics.forEach(function (m) {
                    html += '<td>' + fmtCell(c[m.key], m.format) + '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function sortCompetitors (key) {
            if (compSortKey === key) {
                compSortAsc = !compSortAsc;
            } else {
                compSortKey = key;
                compSortAsc = false;
            }
            // 重新加载（简单起见，重新拉数据；数据量小也可缓存）
            loadCompetitors();
        }

        // ── 背离检测 ──
        async function loadDivergence () {
            const box = document.getElementById('r-divergence');
            const container = document.getElementById('d-signals-container');
            box.style.display = 'block';
            container.innerHTML = '<div class="d-loading">检测中...</div>';

            try {
                const r = await fetch('/api/research/' + ASSET_ID + '/divergence');
                const data = await safeJson(r, '/api/research/divergence');
                if (!data.ok) {
                    container.innerHTML = '<div class="d-empty">加载失败: ' + escapeHtml(data.error || '') + '</div>';
                    return;
                }

                const signals = data.signals || [];
                const metrics = data.metrics || {};
                const avail = data.data_availability || {};

                let html = '';
                if (signals.length === 0) {
                    // 数据不足或暂无背离
                    const missing = [];
                    if (!avail.sentiment) missing.push('情绪');
                    if (!avail.price) missing.push('价格');
                    if (!avail.onchain) missing.push('链上');
                    if (missing.length > 0) {
                        html = '<div class="d-empty">数据不足，无法检测（缺少: ' + missing.join('、') + '）</div>';
                    } else {
                        html = '<div class="d-empty">当前未检测到明显背离信号</div>';
                    }
                } else {
                    signals.forEach(function (s) {
                        const cls = s.type === 'bearish_divergence' ? 'bearish' : 'bullish';
                        const sevLabel = s.severity === 'high' ? '强信号' : '中信号';
                        html += '<div class="d-signal ' + cls + '">';
                        html += '<div class="d-title">';
                        html += (s.type === 'bearish_divergence' ? '⚠️ ' : '💎 ') + escapeHtml(s.label);
                        html += '<span class="d-severity ' + s.severity + '">' + sevLabel + ' · ' + Math.round(s.confidence) + '%</span>';
                        html += '</div>';
                        html += '<div class="d-desc">' + escapeHtml(s.description || '') + '</div>';
                        html += '<div class="d-conds">';
                        (s.conditions || []).forEach(function (c) {
                            const ccls = c.matched ? 'matched' : 'unmatched';
                            html += '<div class="d-cond ' + ccls + '"><span class="dot"></span>' + escapeHtml(c.detail) + '</div>';
                        });
                        html += '</div></div>';
                    });
                }

                // 指标面板（始终展示，即使无信号）
                html += '<div class="d-metrics">';
                const metricItems = [
                    { k: 'sentiment_score', l: '情绪分', f: 'score' },
                    { k: 'price_change_24h', l: '24h 涨跌', f: 'pct' },
                    { k: 'price_change_7d', l: '7d 涨跌', f: 'pct' },
                    { k: 'whale_change_7d_pct', l: '鲸鱼 7d', f: 'pct' },
                    { k: 'holder_change_7d_pct', l: '持有者 7d', f: 'pct' },
                    { k: 'exchange_inflow_24h_pct', l: '24h 入交易所', f: 'pct4' },
                ];
                metricItems.forEach(function (m) {
                    let val = metrics[m.k];
                    let display;
                    if (val === null || val === undefined || val === '') {
                        display = '—';
                    } else if (m.f === 'score') {
                        display = Number(val).toFixed(1);
                    } else if (m.f === 'pct') {
                        const n = Number(val);
                        display = (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
                    } else if (m.f === 'pct4') {
                        const n = Number(val);
                        display = n.toFixed(4) + '%';
                    } else {
                        display = String(val);
                    }
                    html += '<div class="d-metric"><div class="dm-label">' + escapeHtml(m.l) + '</div>';
                    html += '<div class="dm-value">' + display + '</div></div>';
                });
                html += '</div>';

                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="d-empty">网络错误: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderSidebar (d) {
            let side = '';
            const missing = d.missing || [];
            if (d.sector_label) {
                side += '<div style="font-size:12px;color:#fbbf24;margin-bottom:12px">代币分类：' + escapeHtml(d.sector_label) + '</div>';
            }
            side += '<h3>投研资料完整性</h3>';
            if (missing.length === 0) {
                side += '<div class="no-data">无缺失项</div>';
            } else {
                missing.forEach(function (m) {
                    const dot = m.present ? 'ok' : 'miss';
                    const status = m.present ? '已收集' : '缺失';
                    const color = m.present ? '#10b981' : '#dc2626';
                    const desc = m.description ? ' title="' + attrEscape(m.description) + '"' : '';
                    const links = m.links || [];
                    side += '<div class="r-group">' +
                        '<div class="r-group-head"' + desc + ' onclick="toggleGroup(this)">' +
                        '<span class="dot ' + dot + '"></span>' +
                        '<span>' + escapeHtml(m.label) + '</span>' +
                        '<span class="cnt">' + links.length + '</span>' +
                        '<span style="margin-left:auto;color:' + color + '">' + status + '</span>' +
                        '<span class="chev">▶</span>' +
                        '</div>' +
                        '<div class="r-group-body">';
                    if (links.length === 0) {
                        side += '<div class="no-data">暂无链接</div>';
                    } else {
                        links.forEach(function (l) {
                            side += renderSourceItem(l);
                        });
                    }
                    side += '</div></div>';
                });
            }

            document.getElementById('r-sidebar').innerHTML = side;
        }

        function renderSourceItem (s) {
            const title = escapeHtml(s.title || s.url || '');
            let html = '<div class="r-src"><div class="r-src-head">';
            if (s.url) {
                html += '<a href="' + attrEscape(s.url) + '" target="_blank" rel="noopener">' + title + '</a>';
            } else {
                html += '<span>' + title + '</span>';
            }
            if (s.published_at) {
                html += '<span class="r-src-date" title="发布/更新日期">📅 ' + escapeHtml(s.published_at) + '</span>';
            }
            if (s.url) {
                html += '<button class="r-content-btn" data-url="' + attrEscape(s.url) + '" onclick="toggleSourceContent(this)">内容</button>';
            }
            html += '</div><div class="r-src-content" style="display:none"></div></div>';
            return html;
        }

        function toggleGroup (head) {
            head.parentElement.classList.toggle('open');
        }

        function toggleSourceContent (btn) {
            const wrap = btn.closest('.r-src');
            const box = wrap.querySelector('.r-src-content');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                if (!box.getAttribute('data-loaded')) {
                    box.innerHTML = '<div class="no-data">加载中...</div>';
                    fetchSourceContent(btn.getAttribute('data-url'), box);
                }
            } else {
                box.style.display = 'none';
            }
        }

        async function fetchSourceContent (url, box) {
            try {
                const res = await fetch('/api/research/source/content?url=' + encodeURIComponent(url));
                const data = await safeJson(res, '/api/research/source/content');
                if (!data.ok) throw new Error(data.error || '抓取失败');
                const content = (data.content || '').trim();
                box.setAttribute('data-loaded', '1');
                box.innerHTML = content
                    ? escapeHtml(content)
                    : '<div class="no-data">未能抓取到正文（可能是图片/JS 渲染页面）</div>';
            } catch (e) {
                box.setAttribute('data-loaded', '1');
                box.innerHTML = '<div class="no-data">抓取失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        // ── 对话 ──
        function renderMessages (messages) {
            const box = document.getElementById('r-messages');
            if (!messages || messages.length === 0) {
                box.innerHTML = '<div class="no-data">还没有对话。输入问题开始投研。</div>';
                return;
            }
            let html = '';
            messages.forEach(function (m) { html += renderMessage(m); });
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        }

        function renderMessage (m) {
            const roleLabel = m.role === 'user' ? '你' : 'AI 助手';
            const roleCls = m.role === 'user' ? 'user' : 'assistant';
            let html = '<div class="r-msg ' + roleCls + '">';
            html += '<div class="r-msg-role">' + roleLabel + '</div>';
            html += '<div class="r-msg-content">' + escapeHtml(m.content || '') + '</div>';
            const cites = m.citations || [];
            if (cites.length) {
                html += '<div class="r-citations"><strong>引用来源：</strong>';
                cites.forEach(function (c) {
                    html += '<span class="r-cite">[' + c.index + '] ' + escapeHtml(c.title || '');
                    if (c.url) {
                        html += ' <a href="' + attrEscape(c.url) + '" target="_blank" rel="noopener">' + escapeHtml(c.url) + '</a>';
                    }
                    if (c.quote) {
                        html += '<br><span style="color:#6b7280">“' + escapeHtml(c.quote) + '”</span>';
                    }
                    html += '</span>';
                });
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function appendMessage (m) {
            const box = document.getElementById('r-messages');
            if (box.querySelector('.no-data')) box.innerHTML = '';
            box.insertAdjacentHTML('beforeend', renderMessage(m));
            box.scrollTop = box.scrollHeight;
        }

        async function askResearchQuestion () {
            if (researchAsking) return;
            if (!researchNotebookId) { alert('笔记本尚未打开'); return; }
            const ta = document.getElementById('r-question');
            const question = ta.value.trim();
            if (!question) return;

            researchAsking = true;
            const btn = document.getElementById('r-ask-btn');
            btn.disabled = true;
            btn.textContent = '思考中...';
            ta.value = '';

            appendMessage({ role: 'user', content: question, citations: [] });

            try {
                const startRes = await fetch('/api/research/notebook/' + researchNotebookId + '/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question }),
                });
                const startData = await safeJson(startRes, '/api/research/notebook/' + researchNotebookId + '/ask');
                if (!startData.ok) throw new Error(startData.error || '启动失败');

                await waitForTask(startData.task_id, 600000);

                const resultRes = await fetch('/api/tasks/' + startData.task_id + '/result');
                const resultData = await safeJson(resultRes, '/api/tasks/' + startData.task_id + '/result');
                if (resultData.pending) throw new Error('回答超时，请稍后重试');

                const result = resultData.result;
                if (resultData.ok && result && result.ok) {
                    appendMessage(result.data.message);
                } else {
                    throw new Error((result && result.error) || resultData.error || '未知错误');
                }
            } catch (e) {
                appendMessage({ role: 'assistant', content: '回答失败: ' + e.message, citations: [] });
            }

            researchAsking = false;
            btn.disabled = false;
            btn.textContent = '发送';
            ta.focus();
        }

        loadNotebook();
    </script>
</body>
