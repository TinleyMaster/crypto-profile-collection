        function renderTokenomics (d) {
            const container = document.getElementById('tm-container');
            const hasAny = d.total_supply != null || d.circulating_supply != null || d.max_supply != null ||
                (d.allocation && Object.keys(d.allocation).length > 0);

            if (!hasAny) {
                container.innerHTML = '<div class="tm-empty">暂无代币经济学数据</div>';
                return;
            }

            let html = '';

            // 核心 supply 指标
            html += '<div class="tm-grid">';
            html += '<div class="tm-cell"><div class="tm-label">总供应量</div><div class="tm-value">' + fmtNumberBig(d.total_supply) + '</div></div>';
            html += '<div class="tm-cell"><div class="tm-label">流通供应量</div><div class="tm-value">' + fmtNumberBig(d.circulating_supply) + '</div></div>';
            html += '<div class="tm-cell"><div class="tm-label">最大供应量</div><div class="tm-value">' + fmtNumberBig(d.max_supply) + '</div></div>';

            let circRatio = null;
            if (d.circulating_supply != null && d.total_supply != null && Number(d.total_supply) > 0) {
                circRatio = Number(d.circulating_supply) / Number(d.total_supply) * 100;
            }
            html += '<div class="tm-cell"><div class="tm-label">流通率</div><div class="tm-value">' + fmtPct(circRatio) + '</div></div>';
            html += '</div>';

            // 代币分配
            const alloc = d.allocation || {};
            const allocKeys = Object.keys(alloc);
            if (allocKeys.length > 0) {
                html += '<div class="tm-section-title">代币分配</div><div class="tm-bars">';
                allocKeys.slice(0, 8).forEach(function (k) {
                    const v = alloc[k];
                    let pctVal = null;
                    if (typeof v === 'number') pctVal = v;
                    else if (v && typeof v === 'object' && v.percentage != null) pctVal = v.percentage;
                    else if (v && typeof v === 'object' && v.value != null) pctVal = v.value;
                    if (pctVal == null || isNaN(Number(pctVal))) return;
                    const n = Number(pctVal);
                    const label = k;
                    html += '<div class="tm-bar">' +
                        '<div class="tm-bar-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</div>' +
                        '<div class="tm-bar-track"><div class="tm-bar-fill" style="width:' + Math.min(100, Math.max(0, n)) + '%"></div></div>' +
                        '<div class="tm-bar-pct">' + n.toFixed(1) + '%</div>' +
                        '</div>';
                });
                html += '</div>';
            }

            // 关键信息文本
            const infoParts = [];
            if (d.inflation_info) infoParts.push('通胀: ' + String(d.inflation_info).slice(0, 120));
            if (d.emission_schedule) infoParts.push('排放: ' + String(d.emission_schedule).slice(0, 120));
            if (d.burn_info) infoParts.push('销毁: ' + String(d.burn_info).slice(0, 120));
            if (d.lp_locked != null) infoParts.push('流动性锁定: ' + (d.lp_locked ? '是' : '否'));
            if (d.contract_renounced != null) infoParts.push('合约权限放弃: ' + (d.contract_renounced ? '是' : '否'));
            if (d.tax_info) infoParts.push('税收: ' + String(d.tax_info).slice(0, 120));
            if (infoParts.length > 0) {
                html += '<div class="tm-section-title">关键机制</div><div class="tm-info">' + escapeHtml(infoParts.join(' · ')) + '</div>';
            }

            container.innerHTML = html;
        }

        // ── 行情表现 ──
        async function loadMarketHistory () {
            const box = document.getElementById('r-market');
            const container = document.getElementById('m-container');
            box.style.display = 'block';
            container.innerHTML = '<div class="m-empty">加载中...</div>';

            try {
                const r = await fetch('/api/research/' + ASSET_ID + '/market-history?days=30');
                const data = await safeJson(r, '/api/research/market-history');
                if (!data.ok) {
                    container.innerHTML = '<div class="m-empty">加载失败: ' + escapeHtml(data.error || '') + '</div>';
                    return;
                }
                renderMarketHistory(data);
            } catch (e) {
                container.innerHTML = '<div class="m-empty">网络错误: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderMarketHistory (data) {
            const container = document.getElementById('m-container');
            const series = data.series || [];
            const latest = data.latest || (series.length ? series[series.length - 1] : null);

            if (!latest) {
                container.innerHTML = '<div class="m-empty">暂无行情数据</div>';
                return;
            }

            let html = '';
            const price = latest.price_usd;
            const ch24 = latest.change_24h;
            const chCls = ch24 > 0 ? 'positive' : (ch24 < 0 ? 'negative' : '');
            const chSign = ch24 >= 0 ? '+' : '';
            html += '<div class="m-price">' +
                '<div class="mp-value">' + fmtUsdPrice(price) + '</div>' +
                '<div class="mp-change ' + chCls + '">' + chSign + fmtPct(ch24) + '</div>' +
                '</div>';

            html += '<div class="m-grid">';
            html += '<div class="m-cell"><div class="m-label">流通市值</div><div class="m-value">' + fmtUsdBig(latest.market_cap) + '</div></div>';
            html += '<div class="m-cell"><div class="m-label">FDV</div><div class="m-value">' + fmtUsdBig(latest.fdv) + '</div></div>';
            html += '<div class="m-cell"><div class="m-label">24h 成交量</div><div class="m-value">' + fmtUsdBig(latest.volume_24h) + '</div></div>';
            html += '</div>';

            // 区间表现（基于首尾数据点近似）
            if (series.length >= 2) {
                const first = series[0];
                const intervalDays = Math.max(1, Math.round((Date.now() - new Date(first.date).getTime()) / 86400000));
                const intervalPct = first.price_usd > 0 ? (latest.price_usd - first.price_usd) / first.price_usd * 100 : null;
                html += '<div class="m-grid">';
                html += '<div class="m-cell"><div class="m-label">区间涨跌 (' + intervalDays + '天)</div><div class="m-value ' + cls(intervalPct) + '">' + (intervalPct != null ? ((intervalPct >= 0 ? '+' : '') + fmtPct(intervalPct)) : NA_HTML) + '</div></div>';
                html += '<div class="m-cell"><div class="m-label">数据点数</div><div class="m-value">' + fmtNumber(series.length) + '</div></div>';
                html += '<div class="m-cell"><div class="m-label">最新日期</div><div class="m-value">' + escapeHtml(latest.date) + '</div></div>';
                html += '</div>';
            }

            container.innerHTML = html;
        }

        // ── 异动信号 ──
        async function loadSignals () {
            const box = document.getElementById('r-signals');
            const container = document.getElementById('sg-container');
            box.style.display = 'block';
            container.innerHTML = '<div class="sg-empty">加载中...</div>';

            try {
                const r = await fetch('/api/research/' + ASSET_ID + '/signals');
                const data = await safeJson(r, '/api/research/signals');
                if (!data.ok) {
                    container.innerHTML = '<div class="sg-empty">加载失败: ' + escapeHtml(data.error || '') + '</div>';
                    return;
                }
                renderSignals(data);
            } catch (e) {
                container.innerHTML = '<div class="sg-empty">网络错误: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderSignals (data) {
            const container = document.getElementById('sg-container');
            const signals = data.signals || [];

            if (signals.length === 0) {
                container.innerHTML = '<div class="sg-empty">当前未检测到显著异动信号</div>';
                return;
            }

            const typeMap = {
                price_surge: '价格暴涨',
                price_dump: '价格暴跌',
                volume_surge: '成交量放大',
                oi_surge: 'OI 激增',
                oi_dump: 'OI 骤降',
                funding_extreme: '资金费率极端',
                unlock_soon: '解锁临近',
                holder_concentration_change: '持仓集中度变化'
            };
            const iconMap = {
                price_surge: '🚀', price_dump: '🔻', volume_surge: '📊',
                oi_surge: '💹', oi_dump: '📉', funding_extreme: '⚠️',
                unlock_soon: '🔓', holder_concentration_change: '👁️'
            };

            let html = '';
            signals.forEach(function (s) {
                const sev = s.severity || 'info';
                const title = typeMap[s.type] || s.type;
                const icon = iconMap[s.type] || '🔔';
                const value = s.value != null ? fmtPct(s.value) : '';
                html += '<div class="sg-signal ' + escapeHtml(sev) + '">';
                html += '<div class="sg-icon">' + icon + '</div>';
                html += '<div class="sg-body">';
                html += '<div class="sg-title">' + escapeHtml(title) + (value ? ' · ' + value : '') + '</div>';
                html += '<div class="sg-desc">' + escapeHtml(s.description || '') + '</div>';
                html += '<div class="sg-meta">来源: ' + escapeHtml(s.source || '未知') + ' · 阈值 ' + (s.threshold != null ? fmtPct(s.threshold) : '—') + '</div>';
                html += '</div></div>';
            });

            container.innerHTML = html;
        }

        function cls (v) {
            if (v === null || v === undefined) return '';
            return v > 0 ? 'positive' : (v < 0 ? 'negative' : '');
        }
        function pct (v) {
            if (v === null || v === undefined) return '—';
            return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
        }
        function shortAddr (a) {
            if (!a) return '';
            return a.length > 12 ? a.slice(0, 6) + '...' + a.slice(-4) : a;
        }

        function renderSidebar (d) {
            let side = '';
            const missing = d.missing || [];
            if (d.sector_label) {
                side += '<div style="font-size:12px;color:#fbbf24;margin-bottom:12px">代币分类：' + escapeHtml(d.sector_label) + '</div>';
            }
            side += '<h3>投研资料完整性</h3>';
            if (missing.length === 0) {
                side += '<div class="no-data">无缺失项</div>';
            } else {
                missing.forEach(function (m) {
                    const dot = m.present ? 'ok' : 'miss';
                    const links = m.links || [];
                    const count = (m.count !== undefined && m.count !== null) ? m.count : links.length;
                    const status = m.present ? '已收集(' + count + '份)' : '缺失';
                    const color = m.present ? '#10b981' : '#dc2626';
                    const desc = m.description ? ' title="' + attrEscape(m.description) + '"' : '';
                    side += '<div class="r-group">' +
                        '<div class="r-group-head"' + desc + ' onclick="toggleGroup(this)">' +
                        '<span class="dot ' + dot + '"></span>' +
                        '<span>' + escapeHtml(m.label) + '</span>' +
                        '<span class="cnt">' + count + '</span>' +
                        '<span style="margin-left:auto;color:' + color + '">' + status + '</span>' +
                        '<span class="chev">▶</span>' +
                        '</div>' +
                        '<div class="r-group-body">';
                    if (links.length === 0) {
                        side += '<div class="no-data">暂无链接</div>';
                    } else {
                        links.forEach(function (l) {
                            side += renderSourceItem(l);
                        });
                    }
                    side += '</div></div>';
                });
            }

            document.getElementById('r-sidebar').innerHTML = side;
        }

        function showResearchLinks () {
            const d = window.RESEARCH_DATA;
            if (!d) { alert('笔记本尚未打开'); return; }
            const links = [];
            // 1) 投研资料完整性里的外部链接
            (d.missing || []).forEach(function (m) {
                (m.links || []).forEach(function (l) {
                    if (l && l.url) links.push({ url: l.url, title: l.title || l.url, type: l.type || '资料' });
                });
            });
            // 2) thesis 引用来源
            (d.sources || []).forEach(function (s) {
                if (s && s.url && !links.some(function (x) { return x.url === s.url; })) {
                    links.push({ url: s.url, title: s.title || s.url, type: s.type || '来源' });
                }
            });
            // 3) 去重
            const seen = {};
            const uniq = links.filter(function (x) {
                if (seen[x.url]) return false;
                seen[x.url] = true; return true;
            });
            // 4) 渲染 popover
            let html = '<div id="rl-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center" onclick="closeResearchLinks()">';
            html += '<div style="background:#1e2230;color:#e5e7eb;max-width:560px;width:90%;max-height:80vh;overflow:auto;padding:20px;border-radius:10px" onclick="event.stopPropagation()">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><strong style="font-size:15px">🔗 投研链接</strong><button onclick="closeResearchLinks()" style="background:#374151;color:#e5e7eb;border:none;border-radius:6px;padding:4px 10px;cursor:pointer">关闭</button></div>';
            if (uniq.length === 0) {
                html += '<div style="color:#9ca3af;font-size:13px">暂无外部投研链接</div>';
            } else {
                uniq.forEach(function (x) {
                    html += '<div style="padding:8px 0;border-bottom:1px solid #374151">'
                        + '<a href="' + attrEscape(x.url) + '" target="_blank" rel="noopener" style="color:#60a5fa;word-break:break-all">'
                        + escapeHtml(x.title)
                        + '</a>'
                        + (x.type ? ' <span style="color:#9ca3af;font-size:11px">· ' + escapeHtml(x.type) + '</span>' : '')
                        + '</div>';
                });
            }
            html += '</div></div>';
            const prev = document.getElementById('rl-overlay');
            if (prev) prev.remove();
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function closeResearchLinks () {
            const o = document.getElementById('rl-overlay');
            if (o) o.remove();
        }

        function renderSourceItem (s) {
            const title = escapeHtml(s.title || s.url || '');
            let html = '<div class="r-src"><div class="r-src-head">';
            if (s.url) {
                html += '<a href="' + attrEscape(s.url) + '" target="_blank" rel="noopener">' + title + '</a>';
            } else {
                html += '<span>' + title + '</span>';
            }
            if (s.published_at) {
                html += '<span class="r-src-date" title="发布/更新日期">📅 ' + escapeHtml(s.published_at) + '</span>';
            }
            if (s.url) {
                html += '<button class="r-content-btn" data-url="' + attrEscape(s.url) + '" onclick="toggleSourceContent(this)">内容</button>';
            }
            html += '</div><div class="r-src-content" style="display:none"></div></div>';
            return html;
        }

        function toggleGroup (head) {
            head.parentElement.classList.toggle('open');
        }

        function toggleSourceContent (btn) {
            const wrap = btn.closest('.r-src');
            const box = wrap.querySelector('.r-src-content');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                if (!box.getAttribute('data-loaded')) {
                    box.innerHTML = '<div class="no-data">加载中...</div>';
                    fetchSourceContent(btn.getAttribute('data-url'), box);
                }
            } else {
                box.style.display = 'none';
            }
        }

        async function fetchSourceContent (url, box) {
            try {
                const res = await fetch('/api/research/source/content?url=' + encodeURIComponent(url));
                const data = await safeJson(res, '/api/research/source/content');
                if (!data.ok) throw new Error(data.error || '抓取失败');
                const content = (data.content || '').trim();
                box.setAttribute('data-loaded', '1');
                box.innerHTML = content
                    ? escapeHtml(content)
                    : '<div class="no-data">未能抓取到正文（可能是图片/JS 渲染页面）</div>';
            } catch (e) {
                box.setAttribute('data-loaded', '1');
                box.innerHTML = '<div class="no-data">抓取失败: ' + escapeHtml(e.message) + '</div>';
            }
        }

        // ── 对话 ──
        function renderMessages (messages) {
            const box = document.getElementById('r-messages');
            if (!messages || messages.length === 0) {
                box.innerHTML = '<div class="no-data">还没有对话。输入问题开始投研。</div>';
                return;
            }
            let html = '';
            messages.forEach(function (m) { html += renderMessage(m); });
            box.innerHTML = html;
            box.scrollTop = box.scrollHeight;
        }

        function renderMessage (m) {
            const roleLabel = m.role === 'user' ? '你' : 'AI 助手';
            const roleCls = m.role === 'user' ? 'user' : 'assistant';
            let html = '<div class="r-msg ' + roleCls + '">';
            html += '<div class="r-msg-role">' + roleLabel + '</div>';
            html += '<div class="r-msg-content">' + escapeHtml(m.content || '') + '</div>';
            const cites = m.citations || [];
            if (cites.length) {
                html += '<div class="r-citations"><strong>引用来源：</strong>';
                cites.forEach(function (c) {
                    // 兼容两种格式：number（旧）和 {index,title,url}（新）
                    const idx = typeof c === 'object' && c ? c.index : c;
                    const title = typeof c === 'object' && c ? (c.title || '') : '';
                    const url = typeof c === 'object' && c ? (c.url || '') : '';
                    const quote = typeof c === 'object' && c ? (c.quote || '') : '';
                    html += '<span class="r-cite">[' + (idx || '?') + '] ' + escapeHtml(title);
                    if (url) {
                        html += ' <a href="' + attrEscape(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>';
                    }
                    if (quote) {
                        html += '<br><span style="color:#6b7280">"' + escapeHtml(quote) + '"</span>';
                    }
                    html += '</span>';
                });
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function appendMessage (m) {
            const box = document.getElementById('r-messages');
            if (box.querySelector('.no-data')) box.innerHTML = '';
            box.insertAdjacentHTML('beforeend', renderMessage(m));
            box.scrollTop = box.scrollHeight;
        }

        async function askResearchQuestion () {
            if (researchAsking) return;
            if (!researchNotebookId) { alert('笔记本尚未打开'); return; }
            const ta = document.getElementById('r-question');
            const question = ta.value.trim();
            if (!question) return;

            researchAsking = true;
            const btn = document.getElementById('r-ask-btn');
            btn.disabled = true;
            btn.textContent = '思考中...';
            ta.value = '';

            appendMessage({ role: 'user', content: question, citations: [] });

            try {
                const startRes = await fetch('/api/research/notebook/' + researchNotebookId + '/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question }),
                });
                const startData = await safeJson(startRes, '/api/research/notebook/' + researchNotebookId + '/ask');
                if (!startData.ok) throw new Error(startData.error || '启动失败');

                await waitForTask(startData.task_id, 600000);

                const resultRes = await fetch('/api/tasks/' + startData.task_id + '/result');
                const resultData = await safeJson(resultRes, '/api/tasks/' + startData.task_id + '/result');
                if (resultData.pending) throw new Error('回答超时，请稍后重试');

                const result = resultData.result;
                if (resultData.ok && result && result.ok) {
                    appendMessage(result.data.message);
                } else {
                    throw new Error((result && result.error) || resultData.error || '未知错误');
                }
            } catch (e) {
                appendMessage({ role: 'assistant', content: '回答失败: ' + e.message, citations: [] });
            }

            researchAsking = false;
            btn.disabled = false;
            btn.textContent = '发送';
            ta.focus();
        }

        loadNotebook();
    </script>
